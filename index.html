<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="고등학교 인공지능 기초를 이야기, 계단식 확인문제, 용어 카드, 10문제 시험으로 배우는 학습 사이트">
<meta name="theme-color" content="#15201B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315201B'/%3E%3Crect x='6' y='18' width='6' height='8' rx='1' fill='%233BC19C'/%3E%3Crect x='13' y='12' width='6' height='14' rx='1' fill='%233BC19C'/%3E%3Crect x='20' y='6' width='6' height='20' rx='1' fill='%23F2C14E'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>AI 계단 교실</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one 960px reading column; dark graph-paper hero with a stair chart of lessons; lesson page = notebook story + stacked stair cards */
:root{
  --bg:#F4F6F2; --surface:#FFFFFF; --ink:#17201C; --muted:#5A6761; --line:#DCE3DD;
  --accent:#0E7A62; --accent-ink:#FFFFFF; --accent-soft:#E1F1EB;
  --marker:#F2C14E; --marker-ink:#2B2104; --marker-soft:#FCF1D2;
  --ok:#1D8549; --ok-soft:#E2F3E8; --bad:#BF4719; --bad-soft:#FBE8DF;
  --panel:#15201B; --panel-ink:#E8F1EC; --panel-muted:#9DB0A7; --panel-line:rgba(232,241,236,.09);
  --f-display:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171F1C; --ink:#E5ECE8; --muted:#98A69F; --line:#2A3530;
  --accent:#3BC19C; --accent-ink:#062219; --accent-soft:#163329;
  --marker:#F2C14E; --marker-ink:#2B2104; --marker-soft:#3A311C;
  --ok:#4CC27F; --ok-soft:#163124; --bad:#F08A60; --bad-soft:#3A2118;
  --panel:#0A0F0D; --panel-ink:#E8F1EC; --panel-muted:#8FA29A; --panel-line:rgba(232,241,236,.07);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171F1C; --ink:#E5ECE8; --muted:#98A69F; --line:#2A3530;
  --accent:#3BC19C; --accent-ink:#062219; --accent-soft:#163329;
  --marker:#F2C14E; --marker-ink:#2B2104; --marker-soft:#3A311C;
  --ok:#4CC27F; --ok-soft:#163124; --bad:#F08A60; --bad-soft:#3A2118;
  --panel:#0A0F0D; --panel-ink:#E8F1EC; --panel-muted:#8FA29A; --panel-line:rgba(232,241,236,.07);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-family:var(--f-display);font-size:19px;letter-spacing:.01em}
.logo{display:flex;align-items:flex-end;gap:2px;width:22px;height:20px}
.logo i{display:block;flex:1;background:var(--accent);border-radius:2px}
.logo i:nth-child(1){height:35%}.logo i:nth-child(2){height:65%}.logo i:nth-child(3){height:100%;background:var(--marker)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px}
.nav .sw{padding:6px 10px;border-radius:8px;color:var(--accent);font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--line)}
.nav .sw:hover{border-color:var(--accent)}
.nav button[aria-current="true"]{color:var(--ink);background:var(--accent-soft)}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px}
.lv{background:var(--marker);color:var(--marker-ink);font-weight:700;padding:2px 9px;border-radius:999px;font-size:13px}
.theme{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:15px;line-height:1}

main.wrap{padding-block:28px 64px;display:grid;gap:28px}

/* hero */
.hero{background:var(--panel);color:var(--panel-ink);border-radius:18px;padding:32px;display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:end;
  background-image:linear-gradient(var(--panel-line) 1px,transparent 1px),linear-gradient(90deg,var(--panel-line) 1px,transparent 1px);background-size:24px 24px}
.hero > *{min-width:0}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--marker);font-weight:700}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);margin:10px 0 14px;letter-spacing:.01em}
.hero p.lead{color:var(--panel-muted);max-width:40ch}
.hero-cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
.hero-meta{color:var(--panel-muted);font-size:14px}
.stairs{display:flex;align-items:flex-end;gap:6px;height:190px}
.stair{flex:1;height:calc(var(--h) * 16.6%);border:1.5px solid var(--panel-muted);border-bottom:0;border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:var(--f-mono);font-size:12px;color:var(--panel-muted);background:none;transition:background .3s}
.stair.on{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.stair.cur{border-color:var(--panel-ink);color:var(--panel-ink)}
.stairs-cap{font-size:12px;color:var(--panel-muted);margin-top:8px;border-top:1.5px solid var(--panel-muted);padding-top:6px}

.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.hero .btn.primary{background:var(--marker);color:var(--marker-ink)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* flow */
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flow li{border-top:3px solid var(--accent);padding-top:10px;min-width:0}
.flow b{font-family:var(--f-mono);color:var(--accent);font-size:13px;display:block}
.flow strong{display:block;font-size:15px}
.flow span{color:var(--muted);font-size:14px}

/* record */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:20px}
.sec-h small{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.rec{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
.rec > *{min-width:0}
.rec-lv{font-family:var(--f-display);font-size:28px;color:var(--accent)}
.rec-sub{color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--marker);border-radius:999px;transition:width .4s}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;min-width:0}
.badge .m{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;border:1.5px dashed var(--line);color:var(--muted)}
.badge.on .m{border:0;background:var(--marker);color:var(--marker-ink)}
.badge div{min-width:0;line-height:1.35}
.badge strong{display:block;font-size:13px}
.badge span{font-size:11.5px;color:var(--muted)}
.badge:not(.on) strong{color:var(--muted)}

/* units */
.units{display:grid;gap:18px}
.unit{display:grid;grid-template-columns:64px 1fr;gap:18px}
.unit > *{min-width:0}
.unit-no{font-family:var(--f-display);font-size:34px;color:var(--accent);line-height:1}
.unit h3{font-size:18px}
.unit p{color:var(--muted);font-size:14.5px;margin:4px 0 10px}
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}
.les:hover{border-color:var(--accent)}
.les .code{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);flex:none}
.les .t{flex:1;min-width:0;font-weight:500}
.les .t small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.chip{flex:none;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--muted);font-weight:500}
.chip.go{background:var(--marker-soft);color:var(--ink)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.reset{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:13px;color:var(--muted);flex-wrap:wrap}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px;font-size:13px}

/* lesson */
.crumb{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--accent);font-weight:500}
.l-head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.5vw,40px);margin:8px 0 4px}
.l-head .sub{color:var(--muted);font-size:16px}
.goals{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.goals li{padding-left:24px;position:relative}
.goals li::before{content:"";position:absolute;left:2px;top:.55em;width:12px;height:12px;border:2px solid var(--accent);border-radius:3px}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);display:block;margin-bottom:6px}
.story{background:var(--marker-soft);border:0;border-radius:var(--r);padding:26px 28px;
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(127,110,60,.16) 31px 32px)}
.story h2{font-size:20px;margin-bottom:10px}
.story p{line-height:2;max-width:62ch}
.story p + p{margin-top:8px}
.story .q{margin-top:14px;font-weight:700}

.pips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pip{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.pip.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pip.cur{border-color:var(--accent);color:var(--accent);font-weight:700}
.steps{display:grid;gap:12px}
.step{scroll-margin-top:90px}
.step-h{display:flex;align-items:baseline;gap:10px}
.step-h b{font-family:var(--f-mono);font-size:13px;color:var(--accent);flex:none}
.step-h h3{font-size:18px}
.step.locked{background:none;border-style:dashed;padding:14px 22px}
.step.locked h3{color:var(--muted);font-size:16px}
.step.locked .note{color:var(--muted);font-size:13.5px}
.step ul{margin:10px 0 0;padding-left:20px;display:grid;gap:4px}
.step .intro{margin-top:8px}
.key{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--accent-soft);font-weight:500}
.key b{color:var(--accent);margin-right:6px}

.quiz{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.quiz .qq{font-weight:700;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .n{font-family:var(--f-mono);color:var(--muted);flex:none;font-size:13px;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:10px;font-size:14.5px}
.fb.ok{color:var(--ok);font-weight:500}
.fb.no{color:var(--bad)}

.sumlist{margin:0;padding-left:20px;display:grid;gap:6px}
.lock{color:var(--muted);font-size:14px}

.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.match > div{display:grid;gap:8px;align-content:start;min-width:0}
.mc{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;min-height:48px}
.mc.term{font-weight:700}
.mc.sel{border-color:var(--accent);background:var(--accent-soft)}
.mc.got{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.mc.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.tq{padding:16px 0;border-top:1px solid var(--line)}
.tq:first-of-type{border-top:0;padding-top:4px}
.tq .qq{font-weight:500;margin-bottom:10px}
.tq .qq .num{color:var(--accent);margin-right:6px}
.result{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px;border-radius:10px;margin-bottom:8px}
.result.pass{background:var(--ok-soft)}
.result.fail{background:var(--bad-soft)}
.result .score{font-family:var(--f-mono);font-size:34px;font-weight:600}
.result.pass .score{color:var(--ok)} .result.fail .score{color:var(--bad)}
.foot-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot-nav .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-weight:500}
.foot-nav .btn small{color:var(--muted);font-size:12px;font-weight:400}
.foot-nav .next{margin-left:auto;align-items:flex-end;text-align:right}

/* perceptron widget */
.pc{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:14px}
.pc .tag{margin-bottom:10px}
.pc-in{display:flex;gap:8px;flex-wrap:wrap}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tog .num{opacity:.75;margin-left:4px;font-size:12px}
.pc-out{margin-top:12px;font-size:14px;overflow-x:auto}
.pc-out .res{font-weight:700}

/* glossary */
.search{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.gl{display:grid;gap:0}
.gl-row{display:grid;grid-template-columns:180px 1fr auto;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line);align-items:baseline}
.gl-row > *{min-width:0}
.gl-row strong{font-size:16px}
.gl-row button{background:none;border:0;color:var(--accent);font-size:13px;padding:0}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--panel);color:var(--panel-ink);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:up .25s}
.toast b{color:var(--marker)}
@keyframes up{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding:24px}
  .stairs{height:120px}
  .flow{grid-template-columns:1fr 1fr}
  .rec{grid-template-columns:1fr}
  .badges{grid-template-columns:1fr 1fr}
  .unit{grid-template-columns:1fr;gap:6px}
  .match{grid-template-columns:1fr}
  .gl-row{grid-template-columns:1fr;gap:2px}
  .me .xp-txt{display:none}
  .story{padding:20px}
  .card{padding:18px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main class="wrap" id="app"></main>
<div id="toasts" aria-live="polite"></div>

<script>
const UNITS = [
  {id:"1", no:"Ⅰ", title:"인공지능의 이해", desc:"인공지능이 무엇인지, 컴퓨터가 탐색으로 문제를 어떻게 푸는지 알아봐요."},
  {id:"2", no:"Ⅱ", title:"인공지능과 학습", desc:"데이터에서 스스로 규칙을 찾는 기계학습과, 뉴런을 층층이 쌓은 딥러닝의 원리를 배워요."},
  {id:"3", no:"Ⅲ", title:"인공지능의 사회적 영향", desc:"인공지능이 왜 치우친 판단을 하는지, 공정하게 쓰려면 무엇이 필요한지 생각해 봐요."},
  {id:"4", no:"Ⅳ", title:"인공지능 프로젝트", desc:"문제 정의부터 성능 평가까지, 인공지능 프로젝트를 한 단계씩 따라가 봐요."}
];

const LESSONS = [
{id:"1-1", unit:"1", title:"인공지능이란 무엇일까?", sub:"계산기와 말하는 스피커는 무엇이 다를까",
 goals:["인공지능을 ‘사람의 지적 능력을 컴퓨터로 구현한 기술’로 설명할 수 있다.","약한 인공지능과 강한 인공지능을 구분할 수 있다.","튜링 테스트의 아이디어와 한계를 말할 수 있다."],
 story:{title:"말대꾸하는 스피커", p:["토요일 아침, 서윤이는 거실 스피커에게 “오늘 우산 챙겨야 해?”라고 물었다. 스피커는 “오후 3시부터 비 올 확률이 70%예요. 챙기는 게 좋겠어요.”라고 답했다. 옆에서 듣던 동생이 물었다. “누나, 저 스피커는 생각을 하는 거야?”","서윤이는 대답하려다 멈췄다. 계산기도 답을 척척 내놓지만 아무도 계산기를 인공지능이라고 부르지 않는다. 그럼 둘은 무엇이 다른 걸까?"], q:"기계가 ‘똑똑하다’는 건 정확히 무슨 뜻일까요?"},
 steps:[
  {t:"지능이란 무엇일까", p:"사람의 지능은 여러 능력이 합쳐진 거예요.", li:["<b>인식</b>: 보고 듣고 무엇인지 알아차리기","<b>학습</b>: 경험을 바탕으로 점점 나아지기","<b>추론</b>: 근거를 바탕으로 결론 이끌어 내기","<b>언어 이해</b>: 말과 글의 뜻 파악하기","<b>문제 해결</b>: 목표를 정하고 방법 찾기"], key:"인공지능 = 이런 지적 능력을 컴퓨터로 구현한 기술",
   q:{q:"다음 중 ‘학습’ 능력에 가장 가까운 것은?", o:["사진 속 고양이를 알아본다","틀린 문제를 다시 풀며 실수를 줄여 간다","두 수를 더한 값을 출력한다","정해진 시간에 알람을 울린다"], a:1, why:"경험(데이터)을 바탕으로 점점 나아지는 것이 학습이에요."}},
  {t:"계산기와 인공지능의 차이", p:"계산기는 사람이 정해 준 규칙을 그대로 실행해요. 인공지능은 데이터에서 패턴을 찾아 새로운 상황에서도 판단해요.", li:["계산기: 같은 입력이면 언제나 같은 출력, 상황 판단 없음","인공지능: 스팸 메일 거르기, 음성 비서, 영상 추천처럼 상황에 맞춰 판단","<b>약한 인공지능</b>: 번역, 바둑처럼 한 가지 일을 잘하는 인공지능","<b>강한 인공지능</b>: 사람처럼 무엇이든 생각하는 범용 지능 (아직 없음)"], key:"지금 우리가 쓰는 인공지능은 모두 약한 인공지능이에요",
   q:{q:"바둑만 잘 두고 다른 일은 못 하는 인공지능은 어디에 속할까요?", o:["강한 인공지능","약한 인공지능","범용 인공지능","계산기"], a:1, why:"특정한 한 가지 일에 특화된 인공지능은 약한 인공지능이에요."}},
  {t:"튜링 테스트", p:"1950년, 앨런 튜링은 ‘기계가 생각할 수 있는가?’라는 어려운 질문 대신 하나의 시험을 제안했어요.", li:["심사자가 보이지 않는 상대 둘(사람, 기계)과 글로만 대화해요","누가 기계인지 가려내지 못하면 기계가 통과한 것으로 봐요","한계: 대화를 잘 흉내 내는 것과 실제로 이해하는 것은 다를 수 있어요","웹사이트의 ‘로봇이 아닙니다’ 확인은 거꾸로 컴퓨터가 사람을 가려내는 <b>역 튜링 테스트</b>예요"], key:"튜링 테스트는 ‘생각’을 직접 재지 않고 행동으로 판단해요",
   q:{q:"튜링 테스트에서 기계가 통과했다고 보는 경우는?", o:["기계가 계산을 사람보다 빨리 했을 때","심사자가 기계와 사람을 구별하지 못했을 때","기계가 스스로 질문을 만들었을 때","기계가 그림을 그렸을 때"], a:1, why:"대화만으로 사람과 구별되지 않으면 통과예요."}}
 ],
 summary:["인공지능은 인식·학습·추론 같은 사람의 지적 능력을 컴퓨터로 구현한 기술이에요.","계산기는 정해진 규칙만 따르고, 인공지능은 데이터에서 찾은 패턴으로 판단해요.","오늘날의 인공지능은 한 가지 일에 특화된 약한 인공지능이에요.","튜링 테스트는 대화로 기계와 사람을 구별할 수 있는지 보는 시험이에요."],
 cards:[["인공지능","사람의 지적 능력을 컴퓨터로 구현한 기술"],["약한 인공지능","특정한 한 가지 일을 잘하는 인공지능"],["강한 인공지능","사람처럼 어떤 문제든 생각할 수 있는 범용 지능"],["튜링 테스트","대화만으로 기계와 사람을 구별할 수 있는지 보는 시험"]],
 test:[
  {q:"인공지능을 가장 알맞게 설명한 것은?", o:["사람의 지적 능력을 컴퓨터로 구현한 기술","전기로 움직이는 모든 기계","인터넷에 연결된 기기","빠르게 계산하는 프로그램"], a:0},
  {q:"다음 중 인공지능을 활용한 예가 아닌 것은?", o:["스팸 메일 자동 분류","음성 비서의 질문 답변","전자레인지 타이머","동영상 추천"], a:2},
  {q:"튜링 테스트를 제안한 사람은?", o:["앨런 튜링","찰스 배비지","존 매카시","제프리 힌턴"], a:0},
  {q:"로그인할 때 ‘로봇이 아닙니다’를 확인하는 것과 가장 관련 있는 것은?", o:["역 튜링 테스트","체력 테스트","정확도 평가","교차 검증"], a:0},
  {q:"약한 인공지능에 대한 설명으로 옳은 것은?", o:["이미 사람과 똑같이 생각한다","특정 분야의 일을 잘 해낸다","스스로 감정을 느낀다","모든 분야의 문제를 푼다"], a:1},
  {q:"튜링 테스트의 한계로 알맞은 것은?", o:["대화를 잘 흉내 내도 실제로 이해한다고 단정할 수 없다","시험에 시간이 너무 오래 걸린다","사람만 참여할 수 있다","계산 문제만 낼 수 있다"], a:0},
  {q:"‘근거를 바탕으로 결론을 이끌어 내는 능력’은?", o:["인식","추론","기억","감각"], a:1}
 ]},

{id:"1-2", unit:"1", title:"탐색으로 문제 풀기", sub:"미로에서 출구까지 가장 빠른 길 찾기",
 goals:["문제를 상태와 행동으로 표현할 수 있다.","너비 우선 탐색과 깊이 우선 탐색을 비교할 수 있다.","휴리스틱이 탐색을 어떻게 줄이는지 설명할 수 있다."],
 story:{title:"학교 축제 미로", p:["축제 날, 체육관에 종이 상자로 만든 미로가 생겼다. 도윤이는 갈림길마다 무조건 오른쪽 길로 끝까지 가 봤고, 하린이는 갈림길이 나올 때마다 갈 수 있는 길을 한 칸씩 모두 살펴봤다.","하린이가 먼저 나왔다. 그런데 출구 쪽 창문 불빛을 보고 방향을 정한 지호가 둘보다 더 빨랐다."], q:"컴퓨터는 수많은 갈림길 가운데 어떻게 길을 고를까요?"},
 steps:[
  {t:"문제를 상태로 바꾸기", p:"컴퓨터가 문제를 풀려면 먼저 문제를 ‘상태’와 ‘행동’으로 표현해야 해요.", li:["<b>상태</b>: 지금의 상황 (미로 속 현재 위치)","<b>초기 상태</b>는 출발점, <b>목표 상태</b>는 출구","<b>행동</b>: 상태를 바꾸는 움직임 (위·아래·왼쪽·오른쪽)","<b>상태 공간</b>: 만들 수 있는 모든 상태의 모음, 나무(트리) 모양으로 그려 볼 수 있어요"], key:"탐색 = 상태 공간에서 초기 상태부터 목표 상태까지 가는 경로 찾기",
   q:{q:"미로 문제에서 ‘목표 상태’에 해당하는 것은?", o:["출발점","출구","벽","갈림길의 개수"], a:1, why:"도달하고 싶은 상황, 곧 출구가 목표 상태예요."}},
  {t:"너비 우선과 깊이 우선", li:["<b>너비 우선 탐색(BFS)</b>: 가까운 칸부터 한 단계씩 모두 살펴봐요. 하린이 방식이에요","가장 짧은 경로를 찾을 수 있지만, 기억해 둘 칸이 많아요","<b>깊이 우선 탐색(DFS)</b>: 한 길을 끝까지 가 보고 막히면 되돌아와요. 도윤이 방식이에요","기억할 것은 적지만, 먼 길로 돌아갈 수 있어요"], key:"BFS는 넓게, DFS는 깊게",
   q:{q:"출발점에서 가까운 상태부터 차례로 모두 살펴보는 탐색은?", o:["깊이 우선 탐색","너비 우선 탐색","무작위 탐색","휴리스틱 탐색"], a:1, why:"한 단계씩 넓게 퍼져 나가는 것이 너비 우선 탐색이에요."}},
  {t:"휴리스틱: 똑똑한 어림짐작", li:["<b>휴리스틱</b>: 목표까지 얼마나 남았는지 어림하는 기준","예: 출구까지의 직선거리, 지호가 본 창문 불빛","가망 있는 길부터 살펴보니 탐색 횟수가 줄어요","길 찾기 앱, 게임 캐릭터의 이동(A* 알고리즘)에 쓰여요"], key:"좋은 휴리스틱일수록 덜 헤매요",
   q:{q:"휴리스틱 탐색의 장점으로 알맞은 것은?", o:["모든 경로를 빠짐없이 확인한다","목표에 가까워 보이는 길부터 살펴 탐색을 줄인다","항상 메모리를 가장 적게 쓴다","상태 공간을 만들 필요가 없다"], a:1, why:"어림짐작으로 유망한 길을 먼저 고르는 것이 핵심이에요."}}
 ],
 summary:["탐색 문제는 상태, 행동, 초기 상태, 목표 상태로 표현해요.","너비 우선 탐색은 가까운 상태부터 넓게, 깊이 우선 탐색은 한 길을 끝까지 살펴요.","너비 우선 탐색은 최단 경로를, 깊이 우선 탐색은 적은 메모리를 장점으로 가져요.","휴리스틱은 목표까지의 거리를 어림해 탐색을 줄여요."],
 cards:[["상태 공간","만들 수 있는 모든 상태의 모음"],["너비 우선 탐색","가까운 상태부터 한 단계씩 모두 살펴보는 탐색"],["깊이 우선 탐색","한 길을 끝까지 가 보고 막히면 되돌아오는 탐색"],["휴리스틱","목표까지 남은 정도를 어림하는 기준"]],
 test:[
  {q:"탐색 문제에서 ‘행동’의 역할은?", o:["상태를 다른 상태로 바꾼다","목표를 정한다","탐색을 끝낸다","상태를 지운다"], a:0},
  {q:"한 길을 끝까지 따라가다가 막히면 되돌아오는 탐색은?", o:["너비 우선 탐색","깊이 우선 탐색","휴리스틱","이진 분류"], a:1},
  {q:"너비 우선 탐색의 특징으로 옳은 것은?", o:["가장 짧은 경로를 찾을 수 있다","기억할 것이 거의 없다","항상 가장 먼저 끝난다","목표 상태가 필요 없다"], a:0},
  {q:"길 찾기 앱이 ‘목적지까지의 직선거리’를 활용하는 것은 무엇의 예인가요?", o:["휴리스틱","상태 공간","과적합","레이블"], a:0},
  {q:"초기 상태에서 만들 수 있는 모든 상태를 모은 것은?", o:["데이터셋","상태 공간","신경망","학습률"], a:1},
  {q:"숫자 퍼즐 게임에서 ‘상태’로 가장 알맞은 것은?", o:["퍼즐 조각의 현재 배치","퍼즐의 색깔","퍼즐을 푼 사람","퍼즐의 가격"], a:0},
  {q:"깊이 우선 탐색이 너비 우선 탐색보다 유리한 점은?", o:["항상 최단 경로를 찾는다","기억해야 할 상태가 적다","목표를 더 정확히 안다","되돌아가지 않는다"], a:1}
 ]},

{id:"2-1", unit:"2", title:"기계학습은 어떻게 배울까?", sub:"규칙을 알려 주지 않아도 규칙을 찾는 기계",
 goals:["규칙 기반 프로그래밍과 기계학습의 차이를 설명할 수 있다.","특성과 레이블을 구분할 수 있다.","지도학습, 비지도학습, 강화학습을 사례로 구분할 수 있다."],
 story:{title:"스팸 메일 거르기 대작전", p:["정보 동아리 부장 은호는 ‘무료’, ‘당첨’이라는 단어가 있으면 스팸으로 거르는 프로그램을 만들었다. 그런데 다음 날 ‘무.료’, ‘당 첨’처럼 살짝 바꾼 스팸이 쏟아졌다.","규칙을 하나 더하면 스팸은 또 모양을 바꿨다. 선생님이 말씀하셨다. “규칙을 네가 다 쓰지 말고, 스팸 메일 수천 통을 보여 주고 컴퓨터가 규칙을 찾게 하면 어떨까?”"], q:"사람이 규칙을 알려 주지 않았는데, 컴퓨터는 어떻게 배울 수 있을까요?"},
 steps:[
  {t:"규칙을 찾는 기계", li:["기존 프로그래밍: 사람이 규칙을 쓰고, 데이터를 넣으면 답이 나와요","<b>기계학습</b>: 데이터와 정답을 함께 주면 컴퓨터가 규칙(모델)을 찾아요","<b>특성</b>: 판단에 쓰는 정보 (메일 속 링크 수, 특정 단어 빈도)","<b>레이블</b>: 데이터에 붙은 정답 (스팸 / 정상)"], key:"기계학습 = 데이터에서 규칙을 스스로 찾는 것",
   q:{q:"스팸 분류에서 메일마다 붙은 ‘스팸’ 또는 ‘정상’이라는 정답 표시를 무엇이라 하나요?", o:["특성","레이블","모델","상태"], a:1, why:"정답 표시가 레이블, 판단 재료가 특성이에요."}},
  {t:"지도학습과 비지도학습", li:["<b>지도학습</b>: 정답(레이블)이 있는 데이터로 배워요","<b>분류</b>: 정해진 범주 가운데 하나 고르기 (스팸 / 정상)","<b>회귀</b>: 숫자 값 예측하기 (내일 기온, 집값)","<b>비지도학습</b>: 정답 없이 비슷한 것끼리 묶어요. 대표 방법이 <b>군집</b>이에요 (취향이 비슷한 고객 묶기)"],
   q:{q:"학생들의 공부 시간으로 시험 점수(숫자)를 예측하는 것은?", o:["분류","회귀","군집","강화학습"], a:1, why:"연속된 숫자를 예측하면 회귀예요."}},
  {t:"강화학습", li:["<b>에이전트</b>가 환경 속에서 행동하고 <b>보상</b>을 받아요","보상이 커지는 쪽으로 행동을 조금씩 고쳐 나가요","정답을 미리 주지 않고 시행착오로 배워요","예: 게임 공략, 로봇 걷기, 바둑 두기"], key:"지도학습은 정답으로, 비지도학습은 묶기로, 강화학습은 보상으로 배워요",
   q:{q:"로봇이 넘어지면 감점, 앞으로 걸으면 가점을 받으며 걷는 법을 익히는 방식은?", o:["지도학습","비지도학습","강화학습","규칙 기반"], a:2, why:"보상을 따라 시행착오로 배우는 것이 강화학습이에요."}}
 ],
 summary:["기계학습은 사람이 규칙을 쓰지 않고 데이터에서 규칙을 찾는 방법이에요.","특성은 판단 재료, 레이블은 정답이에요.","지도학습은 분류와 회귀, 비지도학습은 군집이 대표적이에요.","강화학습은 보상을 받으며 시행착오로 배워요."],
 cards:[["특성","판단에 쓰는 데이터의 정보"],["레이블","데이터에 붙은 정답"],["회귀","숫자 값을 예측하는 지도학습"],["군집","정답 없이 비슷한 데이터끼리 묶기"],["강화학습","보상을 받으며 시행착오로 배우는 방식"]],
 test:[
  {q:"기계학습과 기존 프로그래밍의 차이로 옳은 것은?", o:["기계학습은 데이터에서 규칙을 찾는다","기계학습은 데이터가 필요 없다","기존 프로그래밍은 규칙이 필요 없다","둘은 같은 방식이다"], a:0},
  {q:"사진을 ‘개’ 또는 ‘고양이’로 나누는 것은?", o:["분류","회귀","군집","탐색"], a:0},
  {q:"정답 없이 쇼핑 기록이 비슷한 고객끼리 묶는 것은?", o:["지도학습","비지도학습","강화학습","튜링 테스트"], a:1},
  {q:"강화학습에서 행동이 좋았는지 알려 주는 신호는?", o:["레이블","보상","특성","휴리스틱"], a:1},
  {q:"집의 넓이와 방 개수로 집값을 예측할 때 ‘넓이, 방 개수’는?", o:["레이블","특성","보상","군집"], a:1},
  {q:"다음 중 회귀 문제는?", o:["내일 최고 기온 예측","메일의 스팸 여부 판단","손글씨 숫자 인식","뉴스를 주제별로 묶기"], a:0},
  {q:"은호의 규칙 기반 스팸 필터가 실패한 까닭은?", o:["스팸이 모양을 바꾸면 규칙이 따라가지 못해서","컴퓨터가 느려서","메일이 너무 적어서","레이블이 너무 많아서"], a:0}
 ]},

{id:"2-2", unit:"2", title:"인공신경망과 딥러닝", sub:"뉴런 하나에서 층층이 쌓인 신경망까지",
 goals:["퍼셉트론의 입력, 가중치, 활성화 함수를 설명할 수 있다.","신경망의 학습이 가중치를 고치는 과정임을 설명할 수 있다.","딥러닝의 활용 분야를 사례로 말할 수 있다."],
 story:{title:"급식 만족도 예측기", p:["학생회 지민이는 ‘오늘 급식이 맛있었다’는 반응이 나올지 미리 맞혀 보고 싶었다. 고기 반찬이 있는지, 디저트가 나왔는지, 국이 따뜻했는지를 하나씩 점수로 매겨 더해 보았다.","그런데 친구들은 디저트보다 고기 반찬을 훨씬 중요하게 여겼다. 항목마다 중요도를 다르게 줘야 했다. 이것이 바로 인공 뉴런의 아이디어다."], q:"중요한 정보에 더 큰 무게를 주는 기계는 어떻게 만들까요?"},
 steps:[
  {t:"퍼셉트론: 인공 뉴런 하나", li:["<b>입력(x)</b>: 고기 반찬 있음 = 1, 없음 = 0","<b>가중치(w)</b>: 입력마다 곱하는 중요도","<b>가중합</b>: x₁w₁ + x₂w₂ + x₃w₃ + 편향(b)","<b>활성화 함수</b>: 가중합이 0보다 크면 1(맛있음), 아니면 0"], widget:"perceptron", key:"출력 = 활성화 함수(입력 × 가중치의 합 + 편향)",
   q:{q:"퍼셉트론에서 각 입력의 중요도를 나타내는 값은?", o:["편향","가중치","레이블","보상"], a:1, why:"가중치가 클수록 그 입력이 결과에 더 큰 영향을 줘요."}},
  {t:"학습은 가중치를 고치는 일", li:["처음에는 가중치를 아무 값으로 정해요","예측과 정답을 비교해 <b>오차</b>를 구해요","오차가 줄어드는 방향으로 가중치를 조금씩 고쳐요","데이터 전체를 한 번 다 쓰는 단위를 <b>에포크</b>라 하고, 여러 번 반복해요","층이 여러 개일 때 오차를 뒤에서부터 나누어 고치는 방법이 <b>역전파</b>예요"],
   q:{q:"신경망이 ‘학습한다’는 것은 주로 무엇을 바꾸는 것인가요?", o:["입력 데이터","가중치","정답","층의 이름"], a:1, why:"데이터와 정답은 그대로, 가중치를 바꿔 오차를 줄여요."}},
  {t:"층을 깊게 쌓은 딥러닝", li:["입력층 → 은닉층(여러 개) → 출력층","은닉층이 많을수록 복잡한 특징을 단계별로 배워요 (선 → 모양 → 얼굴)","<b>컴퓨터 비전</b>: 사진과 영상 속 물체 알아보기","<b>음성 인식</b>: 말소리를 글자로 바꾸기","<b>자연어 처리</b>: 번역, 요약, 챗봇"], key:"딥러닝 = 은닉층이 여러 개인 깊은 신경망",
   q:{q:"번역기와 챗봇이 주로 활용하는 딥러닝 분야는?", o:["컴퓨터 비전","음성 합성","자연어 처리","탐색"], a:2, why:"사람의 말과 글을 다루는 분야가 자연어 처리예요."}}
 ],
 summary:["퍼셉트론은 입력에 가중치를 곱해 더하고, 활성화 함수로 출력을 정해요.","학습은 오차가 줄어드는 방향으로 가중치를 고치는 과정이에요.","은닉층을 여러 개 쌓은 신경망으로 배우는 것이 딥러닝이에요.","딥러닝은 컴퓨터 비전, 음성 인식, 자연어 처리에 널리 쓰여요."],
 cards:[["가중치","입력마다 곱하는 중요도 값"],["활성화 함수","가중합으로 뉴런의 출력을 정하는 함수"],["은닉층","입력층과 출력층 사이의 층"],["역전파","오차를 뒤에서부터 나누어 가중치를 고치는 방법"]],
 test:[
  {q:"퍼셉트론에서 가중합이 기준을 넘는지 판단해 출력을 정하는 것은?", o:["활성화 함수","오차","데이터셋","레이블"], a:0},
  {q:"입력 x₁=1, x₂=0이고 가중치 w₁=0.7, w₂=0.4일 때 가중합은? (편향 0)", o:["0.4","0.7","1.1","0.28"], a:1},
  {q:"딥러닝에서 ‘깊다’는 말의 뜻은?", o:["데이터가 많다","은닉층이 여러 개다","계산이 느리다","가중치가 크다"], a:1},
  {q:"예측과 정답의 차이를 무엇이라 하나요?", o:["오차","편향","보상","특성"], a:0},
  {q:"자율주행차가 카메라로 보행자를 알아보는 것은 어느 분야인가요?", o:["컴퓨터 비전","자연어 처리","음성 인식","강화학습"], a:0},
  {q:"학습 데이터 전체를 한 번 다 사용해 학습하는 단위는?", o:["에포크","레이블","층","상태"], a:0},
  {q:"단순 퍼셉트론 하나로 풀 수 없던 XOR 문제를 풀게 해 준 방법은?", o:["층을 여러 개 쌓은 다층 신경망","입력 개수 줄이기","가중치를 모두 0으로 두기","규칙을 직접 쓰기"], a:0}
 ]},

{id:"3-1", unit:"3", title:"데이터 편향과 공정성", sub:"공정해 보이는 인공지능도 한쪽으로 치우칠 수 있어요",
 goals:["인공지능 편향이 생기는 원인을 설명할 수 있다.","편향이 사회에 끼치는 영향을 사례로 말할 수 있다.","편향을 줄이는 방법과 책임을 제안할 수 있다."],
 story:{title:"얼굴 인식 출석부", p:["어느 학교가 교실 카메라의 얼굴 인식으로 출석을 자동 체크하기로 했다. 그런데 몇 주 뒤, 안경을 쓴 학생들이 자꾸 ‘결석’으로 찍혔다.","알고 보니 시스템을 학습시킨 사진 대부분이 안경을 쓰지 않은 얼굴이었다. 기계는 일부러 차별하지 않았지만, 결과는 공정하지 않았다."], q:"인공지능은 왜 한쪽으로 치우친 판단을 하게 될까요?"},
 steps:[
  {t:"편향은 어디서 올까", li:["<b>데이터 편향</b>: 학습 데이터가 특정 집단에 몰려 있어요","<b>역사적 편향</b>: 과거의 불공정한 결정이 데이터에 그대로 남아 있어요","<b>측정 편향</b>: 데이터를 모으는 방식 자체가 치우쳐 있어요","그 결과, 데이터가 적은 집단에서 오류가 더 많이 나요"], key:"인공지능은 데이터를 거울처럼 닮아요",
   q:{q:"출석부 사례에서 문제가 생긴 원인은?", o:["학습 데이터에 안경 쓴 얼굴이 적었다","카메라가 고장 났다","학생들이 일부러 피했다","인터넷이 느렸다"], a:0, why:"데이터에 적게 들어 있는 집단일수록 인식이 서툴러요."}},
  {t:"편향이 만드는 문제", li:["채용: 과거 합격자가 한쪽 성별에 몰려 있으면 그 성별을 더 높게 평가할 수 있어요","대출·보험: 사는 지역만으로 불리한 판단을 받을 수 있어요","추천: 비슷한 것만 계속 보여 줘 생각이 갇히는 <b>필터 버블</b>이 생겨요","판단을 받는 사람은 왜 그런 결과가 나왔는지 알기 어려워요"],
   q:{q:"좋아하는 영상과 비슷한 것만 계속 추천받아 다양한 관점을 만나기 어려워지는 현상은?", o:["필터 버블","과적합","튜링 테스트","군집"], a:0, why:"추천이 만든 거품 속에 갇힌다는 뜻의 필터 버블이에요."}},
  {t:"공정한 인공지능을 위해", li:["여러 집단을 고르게 담은 데이터를 모아요","전체 정확도뿐 아니라 집단별 정확도를 따로 확인해요","판단 이유를 보여 줄 수 있게 설계해요 (<b>설명 가능성</b>)","중요한 결정은 사람이 최종 검토해요","개발자, 기업, 사용자 모두 책임을 나눠요"], key:"공정성은 다 만든 뒤가 아니라 만들 때부터 챙겨요",
   q:{q:"편향을 줄이는 방법으로 알맞지 않은 것은?", o:["집단별 정확도를 따로 확인한다","데이터를 다양하게 모은다","전체 정확도가 높으면 검토 없이 바로 쓴다","판단 이유를 설명할 수 있게 한다"], a:2, why:"전체 정확도가 높아도 특정 집단의 오류가 숨어 있을 수 있어요."}}
 ],
 summary:["인공지능 편향은 주로 치우친 학습 데이터에서 생겨요.","편향은 채용, 대출, 추천 등에서 불공정한 결과를 만들 수 있어요.","다양한 데이터, 집단별 평가, 설명 가능성, 사람의 검토로 편향을 줄여요.","인공지능의 책임은 만드는 사람과 쓰는 사람 모두에게 있어요."],
 cards:[["데이터 편향","학습 데이터가 특정 집단에 몰려 생기는 치우침"],["역사적 편향","과거의 불공정한 결정이 데이터에 남은 것"],["필터 버블","비슷한 정보만 추천받아 시야가 좁아지는 현상"],["설명 가능성","인공지능이 판단 이유를 보여 줄 수 있는 성질"]],
 test:[
  {q:"인공지능 편향의 가장 흔한 원인은?", o:["치우친 학습 데이터","빠른 컴퓨터","큰 화면","많은 사용자"], a:0},
  {q:"과거 합격자 대부분이 한 성별인 데이터로 만든 채용 인공지능의 문제는?", o:["그 성별을 더 높게 평가할 수 있다","모든 지원자를 똑같이 평가한다","채용을 거부한다","지원자를 늘린다"], a:0},
  {q:"‘설명 가능한 인공지능’이 필요한 까닭은?", o:["판단 이유를 확인하고 잘못을 고치기 위해","계산을 빠르게 하려고","데이터를 줄이려고","화면을 꾸미려고"], a:0},
  {q:"편향이 있어도 전체 정확도는 높게 나올 수 있는 까닭은?", o:["소수 집단의 오류가 전체 평균에 묻혀서","정확도는 항상 100%라서","편향은 정확도와 상관없어서","데이터가 없어서"], a:0},
  {q:"인공지능의 사회적 책임에 대한 설명으로 옳은 것은?", o:["개발자, 기업, 사용자가 함께 책임을 나눈다","인공지능이 혼자 책임진다","아무도 책임지지 않는다","사용자만 책임진다"], a:0},
  {q:"의료 진단처럼 중요한 결정에서 바람직한 방식은?", o:["인공지능 결과를 사람이 검토한다","인공지능 결과를 그대로 따른다","무조건 인공지능을 쓰지 않는다","무작위로 결정한다"], a:0},

const LEVELS = [[0,"새싹"],[100,"관찰자"],[250,"탐구자"],[450,"설계자"],[650,"연구자"]];
const BADGES = [
  {id:"first", m:"1", name:"첫걸음", how:"첫 계단 통과"},
  {id:"oneshot", m:"✓", name:"한 번에 통과", how:"시험 첫 도전에 80점 이상"},
  {id:"perfect", m:"100", name:"만점왕", how:"시험 100점"},
  {id:"cards", m:"가", name:"용어 박사", how:"카드를 실수 없이 완성"},
  {id:"lab", m:"w·x", name:"실험가", how:"퍼셉트론 직접 계산"},
  {id:"unit", m:"▲", name:"단원 정복", how:"한 대단원 모두 완료"},
  {id:"streak", m:"3일", name:"3일 연속", how:"3일 연속 학습"},
  {id:"grad", m:"★", name:"졸업", how:"모든 레슨 완료"}
];
const XP = {step:10, cards:20, pass:50, perfect:20};

/* ---------- state ---------- */
const KEY = "ai-stairs-v1";
const fresh = () => ({v:1, xp:0, les:{}, badges:[], streak:{last:null, n:0}});
let S = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch(e){} return fresh(); })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const L = id => S.les[id] || (S.les[id] = {steps:0, cards:false, best:null, passed:false, tries:0});
const lessonById = id => LESSONS.find(l => l.id === id);
const unitById = id => UNITS.find(u => u.id === id);
const isPassed = id => !!(S.les[id] && S.les[id].passed);

const dayStr = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
(function streak(){
  const today = dayStr(new Date()), y = new Date(); y.setDate(y.getDate()-1);
  if (S.streak.last === today) return;
  S.streak.n = S.streak.last === dayStr(y) ? S.streak.n + 1 : 1;
  S.streak.last = today;
  if (S.streak.n >= 3 && !S.badges.includes("streak")) S.badges.push("streak");
  save();
})();

/* ---------- transient UI ---------- */
let view = {name:"home"};
const ui = {wrong:{}, cards:{}, test:{}, pc:{meat:1, dessert:0, soup:1}, confirmReset:false};
const orders = new Map();
function order(key, n){
  if (!orders.has(key)) { const a = [...Array(n).keys()]; for (let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} orders.set(key,a); }
  return orders.get(key);
}

/* ---------- rewards ---------- */
function toast(html){
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = html;
  document.getElementById("toasts").appendChild(t); setTimeout(() => t.remove(), 2600);
}
function addXP(n, why){ const before = lvl(S.xp); S.xp += n; toast(`<b>+${n} XP</b> ${why}`); if (lvl(S.xp) > before) toast(`레벨 업! <b>Lv.${lvl(S.xp)+1} ${LEVELS[lvl(S.xp)][1]}</b>`); }
function badge(id){ if (S.badges.includes(id)) return; S.badges.push(id); const b = BADGES.find(x=>x.id===id); toast(`배지 획득 <b>${b.name}</b>`); }
function lvl(xp){ let i = 0; LEVELS.forEach((l,k) => { if (xp >= l[0]) i = k; }); return i; }
function checkCompletion(){
  UNITS.forEach(u => { const ls = LESSONS.filter(l => l.unit === u.id); if (ls.every(l => isPassed(l.id))) badge("unit"); });
  if (LESSONS.every(l => isPassed(l.id))) badge("grad");
}

/* ---------- views ---------- */
const OPTN = ["①","②","③","④"];

function header(){
  const i = lvl(S.xp);
  return `<button class="brand" data-act="home" aria-label="홈으로"><span class="logo"><i></i><i></i><i></i></span>AI 계단 교실</button>
  <nav class="nav"><button data-act="home" aria-current="${view.name!=="glossary"}">레슨</button><button data-act="glossary" aria-current="${view.name==="glossary"}">용어 사전</button><a class="sw" href="design/">창의 공학 설계 →</a></nav>
  <div class="me"><span class="lv">Lv.${i+1} ${LEVELS[i][1]}</span><span class="num xp-txt">${S.xp} XP</span>
  <button class="theme" data-act="theme" aria-label="밝게/어둡게 바꾸기">◐</button></div>`;
}

function nextLesson(){ return LESSONS.find(l => !isPassed(l.id)) || LESSONS[0]; }

  const started = Object.keys(S.les).length > 0;

  const pct = nextLv ? Math.round((S.xp - LEVELS[i][0]) / (nextLv[0] - LEVELS[i][0]) * 100) : 100;
  return `
  <section class="hero">
    <div>

      <p class="lead">짧은 이야기로 궁금증을 만들고, 계단마다 확인문제를 풀며 올라가요. 레슨을 마칠 때마다 XP와 배지를 모아요.</p>
      <div class="hero-cta">
        <button class="btn primary" data-act="open" data-id="${nx.id}">${started ? "이어서 하기" : "첫 레슨 시작하기"} →</button>
        <span class="hero-meta num">${done}/${LESSONS.length} 레슨 완료</span>
      </div>
    </div>
    <div>
      <div class="stairs" role="img" aria-label="레슨 ${LESSONS.length}개 중 ${done}개 완료">
        ${LESSONS.map((l,k) => `<span class="stair ${isPassed(l.id)?"on":""} ${l.id===nx.id && done<LESSONS.length?"cur":""}" style="--h:${k+1}">${k+1}</span>`).join("")}
      </div>
      <p class="stairs-cap">레슨을 하나 마칠 때마다 계단이 한 칸씩 채워져요</p>
    </div>
  </section>

  <ol class="flow">
    <li><b>1</b><strong>짧은 이야기</strong><span>일상 속 장면으로 궁금증 만들기</span></li>
    <li><b>2</b><strong>계단 오르기</strong><span>확인문제를 맞히면 다음 칸이 열려요</span></li>
    <li><b>3</b><strong>용어 카드</strong><span>용어와 뜻을 짝지어요</span></li>
    <li><b>4</b><strong>10문제 시험</strong><span>80점 이상이면 레슨 통과</span></li>
  </ol>

  <section>
    <div class="sec-h"><h2>내 기록</h2><small class="num">🔥 ${S.streak.n}일 연속 학습</small></div>
    <div class="card rec">
      <div>
        <div class="rec-lv">Lv.${i+1} ${LEVELS[i][1]}</div>
        <div class="rec-sub num">${S.xp} XP</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="rec-sub">${nextLv ? `다음 레벨(${nextLv[1]})까지 <span class="num">${nextLv[0]-S.xp}</span> XP` : "최고 레벨이에요"}</div>
      </div>
      <div class="badges">
        ${BADGES.map(b => `<div class="badge ${S.badges.includes(b.id)?"on":""}"><span class="m">${b.m}</span><div><strong>${b.name}</strong><span>${b.how}</span></div></div>`).join("")}
      </div>
    </div>
  </section>

  <section>
    <div class="sec-h"><h2>대단원</h2><small>레슨을 눌러 시작해요</small></div>
    <div class="units">
    ${UNITS.map(u => `
      <div class="unit">
        <div class="unit-no">${u.no}</div>
        <div>
          <h3>${u.title}</h3><p>${u.desc}</p>
          ${LESSONS.filter(l => l.unit === u.id).map(l => {
            const s = S.les[l.id];
            const chip = s && s.passed ? `<span class="chip done">완료 · ${s.best}점</span>` : s && s.steps > 0 ? `<span class="chip go">계단 ${s.steps}/3</span>` : `<span class="chip">시작 전</span>`;
            return `<button class="les" data-act="open" data-id="${l.id}"><span class="code">${l.id}</span><span class="t">${l.title}<small>${l.sub}</small></span>${chip}</button>`;
          }).join("")}
        </div>
      </div>`).join("")}
    </div>
  </section>

  <div class="reset">${ui.confirmReset
    ? `기록을 모두 지울까요? 되돌릴 수 없어요. <button class="btn ghost" data-act="reset-yes">모두 지우기</button><button class="linkish" data-act="reset-no">취소</button>`
    : `<button class="linkish" data-act="reset">기록 모두 지우기</button>`}</div>`;
}

function quizBlock(key, q, opts){
  // opts: {solved, wrong:Set, act, data}
  const ord = order(key, q.o.length);
  return `<div class="opts">${ord.map((oi,k) => {
    const cls = opts.solved && oi === q.a ? "right" : opts.wrong.has(oi) ? "wrong" : "";
    return `<button class="opt ${cls}" data-act="${opts.act}" ${opts.data} data-i="${oi}" ${opts.solved || opts.wrong.has(oi) ? "disabled" : ""}><span class="n">${OPTN[k]}</span><span>${q.o[oi]}</span></button>`;
  }).join("")}</div>`;
}

function perceptron(){
  const p = ui.pc, w = {meat:.6, dessert:.2, soup:.3}, b = -.5;
  const sum = p.meat*w.meat + p.dessert*w.dessert + p.soup*w.soup + b;
  const out = sum > 0 ? 1 : 0;
  const tog = (k, label) => `<button class="tog" data-act="pc" data-k="${k}" aria-pressed="${!!p[k]}">${label}<span class="num">w=${w[k]}</span></button>`;
  return `<div class="pc"><span class="tag">직접 계산해 봐요</span>
    <div class="pc-in">${tog("meat","고기 반찬")}${tog("dessert","디저트")}${tog("soup","따뜻한 국")}</div>
    <div class="pc-out num">가중합 = ${p.meat}×0.6 + ${p.dessert}×0.2 + ${p.soup}×0.3 − 0.5 = ${sum.toFixed(1)}<br>
    출력 → <span class="res">${out} (${out ? "맛있음" : "아쉬움"})</span></div></div>`;
}

function lesson(id){
  const l = lessonById(id), s = L(id), u = unitById(l.unit);
  const idx = LESSONS.indexOf(l), prev = LESSONS[idx-1], next = LESSONS[idx+1];
  const stairsDone = s.steps >= l.steps.length;

  const steps = l.steps.map((st, k) => {
    const n = `${k+1}계단`;
    if (k > s.steps) return `<div class="card step locked" id="step-${k}"><div class="step-h"><b>${n}</b><h3>${st.t}</h3></div><p class="note">앞 계단의 확인문제를 맞히면 열려요.</p></div>`;
    const solved = s.steps > k, wk = id+"-s"+k, wrong = ui.wrong[wk] || new Set();
    return `<div class="card step" id="step-${k}">
      <div class="step-h"><b>${n}</b><h3>${st.t}</h3></div>
      ${st.p ? `<p class="intro">${st.p}</p>` : ""}
      <ul>${st.li.map(x => `<li>${x}</li>`).join("")}</ul>
      ${st.widget === "perceptron" ? perceptron() : ""}
      ${st.key ? `<div class="key"><b>꼭 기억해요</b>${st.key}</div>` : ""}
      <div class="quiz"><span class="tag">확인문제 · 맞히면 다음 계단이 열려요</span>
        <p class="qq">${st.q.q}</p>
        ${quizBlock(wk, st.q, {solved, wrong, act:"step", data:`data-id="${id}" data-k="${k}"`})}
        ${solved ? `<p class="fb ok">정답이에요! ${st.q.why}</p>` : wrong.size ? `<p class="fb no">아쉬워요. 위 설명을 다시 읽고 골라 봐요.</p>` : ""}
      </div></div>`;
  }).join("");

  const pips = l.steps.map((st,k) => `<span class="pip ${s.steps>k?"done":s.steps===k?"cur":""}">${s.steps>k?"✓ ":""}${k+1}계단</span>`).join("");

  return `
  <div class="l-head">
    <div class="crumb"><button data-act="home">AI 계단 교실</button><span>›</span><span>${u.no}. ${u.title}</span><span>›</span><span class="num">${l.id}</span></div>
    <h1>${l.title}</h1><p class="sub">${l.sub}</p>
  </div>

  <section class="card"><span class="tag">이번 레슨의 목표</span><ul class="goals">${l.goals.map(g => `<li>${g}</li>`).join("")}</ul></section>

  <section class="story"><span class="tag">이야기 · 먼저 읽어 봐요</span><h2>${l.story.title}</h2>
    ${l.story.p.map(p => `<p>${p}</p>`).join("")}<p class="q">${l.story.q}</p></section>

  <section><div class="sec-h"><h2>계단 오르기</h2><small>${l.steps.length}칸을 한 칸씩</small></div>
    <div class="pips">${pips}</div><div class="steps">${steps}</div></section>

  <section class="card"><span class="tag">정리 · 한 줄씩 다시 보기</span>
    ${stairsDone ? `<ul class="sumlist">${l.summary.map(x => `<li>${x}</li>`).join("")}</ul>` : `<p class="lock">계단을 모두 오르면 열려요.</p>`}</section>

  <section class="card" id="cards"><span class="tag">게임 · 용어 카드 짝 맞추기</span>
    ${stairsDone ? cardGame(l) : `<p class="lock">계단을 모두 오르면 열려요.</p>`}</section>

  <section class="card" id="test"><span class="tag">시험 · 10문제, 80점 이상이면 통과</span>
    ${stairsDone ? testBlock(l) : `<p class="lock">계단을 모두 오르면 열려요. 시험에서 80점 이상을 받으면 이 레슨이 완료돼요.</p>`}</section>

  <nav class="foot-nav">
    ${prev ? `<button class="btn ghost" data-act="open" data-id="${prev.id}"><small>← 이전 레슨</small>${prev.title}</button>` : ""}
    ${next ? `<button class="btn ghost next" data-act="open" data-id="${next.id}"><small>다음 레슨 →</small>${next.title}</button>` : `<button class="btn ghost next" data-act="home"><small>마지막 레슨이에요</small>홈으로</button>`}
  </nav>`;
}

function cardGame(l){
  const s = L(l.id);
  const g = ui.cards[l.id] || (ui.cards[l.id] = {sel:null, got:s.cards ? l.cards.map((_,i)=>i) : [], bad:null, miss:0});
  const n = l.cards.length, to = order("ct"+l.id, n), dor = order("cd"+l.id, n);
  const cls = (side, i) => g.got.includes(i) ? "got" : g.bad && g.bad[side] === i ? "bad" : g.sel && g.sel.side === side && g.sel.i === i ? "sel" : "";
  const all = g.got.length === n;
  return `<p style="margin-bottom:12px;color:var(--muted);font-size:14px">왼쪽 용어를 누르고, 알맞은 뜻을 눌러 짝을 지어요.</p>
  <div class="match">
    <div>${to.map(i => `<button class="mc term ${cls("t",i)}" data-act="card" data-id="${l.id}" data-side="t" data-i="${i}" ${g.got.includes(i)?"disabled":""}>${l.cards[i][0]}</button>`).join("")}</div>
    <div>${dor.map(i => `<button class="mc ${cls("d",i)}" data-act="card" data-id="${l.id}" data-side="d" data-i="${i}" ${g.got.includes(i)?"disabled":""}>${l.cards[i][1]}</button>`).join("")}</div>
  </div>
  ${all ? `<p class="fb ok">모든 짝을 맞혔어요! <button class="linkish" data-act="card-again" data-id="${l.id}">다시 하기</button></p>` : `<p class="fb num" style="color:var(--muted)">${g.got.length}/${n} 짝 완성</p>`}`;
}

function testQs(l){ return [...l.steps.map(s => s.q), ...l.test]; }

function testBlock(l){
  const s = L(l.id);
  const t = ui.test[l.id] || (ui.test[l.id] = {seed:0, ans:{}, done:false, score:0});
  const qs = testQs(l), qo = order("tq"+l.id+"-"+t.seed, qs.length);
  const answered = Object.keys(t.ans).length;
  let head = "";
  if (t.done) {
    const pass = t.score >= 80;
    head = `<div class="result ${pass?"pass":"fail"}"><span class="score">${t.score}점</span>
      <div><strong>${pass ? "통과했어요! 레슨 완료" : "아쉬워요. 80점부터 통과예요"}</strong><br>
      <span style="font-size:14px;color:var(--muted)">틀린 문제의 정답을 아래에서 확인하고 다시 도전해 봐요.</span></div>
      <button class="btn ghost" data-act="retest" data-id="${l.id}">다시 풀기</button></div>`;
  } else if (s.passed) {
    head = `<p class="fb ok" style="margin:0 0 8px">이미 통과한 레슨이에요 (최고 ${s.best}점). 다시 풀어도 좋아요.</p>`;
  }
  const body = qo.map((qi, k) => {
    const q = qs[qi], key = `t${l.id}-${t.seed}-${qi}`, ord = order(key, q.o.length), pick = t.ans[qi];
    return `<div class="tq"><p class="qq"><span class="num">${String(k+1).padStart(2,"0")}</span>${q.q}</p><div class="opts">
      ${ord.map((oi, j) => {
        let c = "";
        if (t.done) c = oi === q.a ? "right" : oi === pick ? "wrong" : "";
        else if (pick === oi) c = "sel";
        return `<button class="opt ${c}" data-act="tpick" data-id="${l.id}" data-q="${qi}" data-i="${oi}" ${t.done?"disabled":""}><span class="n">${OPTN[j]}</span><span>${q.o[oi]}</span></button>`;
      }).join("")}</div></div>`;
  }).join("");
  const submit = t.done ? "" : `<div style="display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap">
    <button class="btn primary" data-act="submit" data-id="${l.id}" ${answered < qs.length ? "disabled" : ""}>채점하기</button>
    <span class="num" style="color:var(--muted);font-size:14px">${answered}/${qs.length} 답함</span></div>`;
  return head + body + submit;
}

function glossary(){
  const rows = LESSONS.flatMap(l => l.cards.map(c => ({t:c[0], d:c[1], l})))
    .sort((a,b) => a.t.localeCompare(b.t, "ko"));
  return `<div class="l-head"><h1>용어 사전</h1><p class="sub">모든 레슨의 용어 ${rows.length}개를 가나다순으로 모았어요.</p></div>
  <input class="search" id="gl-search" type="search" placeholder="용어나 뜻으로 찾기" aria-label="용어 찾기">
  <div class="gl">${rows.map(r => `<div class="gl-row" data-s="${(r.t+" "+r.d).toLowerCase()}"><strong>${r.t}</strong><span>${r.d}</span><button data-act="open" data-id="${r.l.id}">${r.l.id} ${r.l.title} →</button></div>`).join("")}</div>`;
}

function render(){
  document.getElementById("top").innerHTML = header();
  const app = document.getElementById("app");
  app.innerHTML = view.name === "lesson" ? lesson(view.id) : view.name === "glossary" ? glossary() : home();
}
function go(v){ view = v; ui.confirmReset = false; render(); window.scrollTo(0,0); }

/* ---------- events ---------- */
document.addEventListener("input", e => {
  if (e.target.id !== "gl-search") return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".gl-row").forEach(r => { r.hidden = q && !r.dataset.s.includes(q); });
});

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "home") return go({name:"home"});
  if (a === "glossary") return go({name:"glossary"});
  if (a === "open") return go({name:"lesson", id});
  if (a === "theme") {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem(KEY+"-theme", root.dataset.theme); } catch(e){}
    return;
  }
  if (a === "reset") { ui.confirmReset = true; return render(); }
  if (a === "reset-no") { ui.confirmReset = false; return render(); }
  if (a === "reset-yes") {
    S = fresh(); S.streak = {last:dayStr(new Date()), n:1}; save();
    ui.wrong = {}; ui.cards = {}; ui.test = {}; ui.confirmReset = false; orders.clear();
    toast("기록을 모두 지웠어요"); return render();
  }

  if (a === "step") {
    const k = +el.dataset.k, i = +el.dataset.i, l = lessonById(id), q = l.steps[k].q, s = L(id), wk = id+"-s"+k;
    if (i === q.a) {
      if (s.steps === k) { s.steps++; addXP(XP.step, `${k+1}계단 통과`); badge("first"); save(); }
      render();
      const nx = document.getElementById("step-"+(k+1)) || document.getElementById("cards");
      if (nx && s.steps === k+1) setTimeout(() => nx.scrollIntoView({behavior:"smooth", block:"start"}), 350);
    } else { (ui.wrong[wk] || (ui.wrong[wk] = new Set())).add(i); render(); }
    return;
  }

  if (a === "pc") {
    const k = el.dataset.k; ui.pc[k] = ui.pc[k] ? 0 : 1;
    if (!S.badges.includes("lab")) { badge("lab"); save(); }
    return render();
  }

  if (a === "card") {
    const l = lessonById(id), g = ui.cards[id], side = el.dataset.side, i = +el.dataset.i;
    if (g.bad) return;
    if (!g.sel || g.sel.side === side) { g.sel = {side, i}; return render(); }
    const t = side === "t" ? i : g.sel.i, d = side === "d" ? i : g.sel.i;
    g.sel = null;
    if (t === d) {
      g.got.push(t);
      if (g.got.length === l.cards.length) {
        const s = L(id);
        if (!s.cards) { s.cards = true; addXP(XP.cards, "용어 카드 완성"); }
        if (g.miss === 0) badge("cards");
        save();
      }
      return render();
    }
    g.miss++; g.bad = {t, d}; render();
    setTimeout(() => { g.bad = null; render(); }, 650);
    return;
  }
  if (a === "card-again") { ui.cards[id] = {sel:null, got:[], bad:null, miss:0}; orders.delete("ct"+id); orders.delete("cd"+id); return render(); }

  if (a === "tpick") { ui.test[id].ans[+el.dataset.q] = +el.dataset.i; return render(); }
  if (a === "submit") {
    const l = lessonById(id), t = ui.test[id], s = L(id), qs = testQs(l);
    const right = qs.filter((q, qi) => t.ans[qi] === q.a).length;
    t.score = right * 10; t.done = true; s.tries++;
    if (t.score >= 80) {
      if (!s.passed) { s.passed = true; addXP(XP.pass, "레슨 통과"); if (s.tries === 1) badge("oneshot"); }
      if (t.score === 100 && (s.best || 0) < 100) { addXP(XP.perfect, "만점 보너스"); badge("perfect"); }
    }
    s.best = Math.max(s.best || 0, t.score);
    checkCompletion(); save(); render();
    document.getElementById("test").scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  if (a === "retest") { const t = ui.test[id]; t.seed++; t.ans = {}; t.done = false; render(); document.getElementById("test").scrollIntoView({block:"start"}); }
});

try { const th = localStorage.getItem(KEY+"-theme"); if (th) document.documentElement.dataset.theme = th; } catch(e){}
render();
</script>
</body>
</html>
