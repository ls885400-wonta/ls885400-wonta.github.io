<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공학 설계 계단 교실</title>
<meta name="description" content="고등학교 창의 공학 설계를 이야기, 사진·영상, 계단식 확인문제, 용어 카드, 10문제 시험으로 배우는 학습 사이트">
<meta name="theme-color" content="#F3F8FC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FFFFFF'/%3E%3Crect x='6' y='18' width='6' height='8' rx='1.5' fill='%2312B886'/%3E%3Crect x='13' y='12' width='6' height='14' rx='1.5' fill='%23228BE6'/%3E%3Crect x='20' y='6' width='6' height='20' rx='1.5' fill='%23FFC93C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: bright, cool learning UI. Sticky header with course menu; home = hero + stat tiles + unit lists with photo thumbnails;
   lesson = sticky progress bar, left table of contents (desktop), main column with story, media, stairs, summary, cards, test. */
:root{
  --bg:#F3F8FC; --surface:#FFFFFF; --ink:#0A1D2B; --text:#1B2E3C; --muted:#465A6A; --line:#D3E0EA; --soft:#E8F1F8;
  --accent:#1C7ED6; --accent-soft:#E7F2FD; --accent-ink:#FFFFFF; --accent-deep:#1864AB;
  --sun:#FFC93C; --sun-ink:#3A2A00; --sun-soft:#FFF4D1; --ok:#2B9348; --ok-soft:#E3F5E8; --bad:#E8590C; --bad-soft:#FFEDE3;
  --shadow:0 1px 2px rgba(14,36,51,.05),0 6px 20px rgba(14,36,51,.06);
  --f-body:"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --fs:1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#15202B; --ink:#F3F8FC; --text:#DDE8F0; --muted:#A9BBC8; --line:#24323F; --soft:#1B2834;
  --accent:#74C0FC; --accent-soft:#15304A; --accent-ink:#04121C; --accent-deep:#74C0FC;
  --sun-soft:#3A3014; --ok:#5CCB7E; --ok-soft:#173222; --bad:#FF9A5C; --bad-soft:#3A2116; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#15202B; --ink:#F3F8FC; --text:#DDE8F0; --muted:#A9BBC8; --line:#24323F; --soft:#1B2834;
  --accent:#74C0FC; --accent-soft:#15304A; --accent-ink:#04121C; --accent-deep:#74C0FC;
  --sun-soft:#3A3014; --ok:#5CCB7E; --ok-soft:#173222; --bad:#FF9A5C; --bad-soft:#3A2116; --shadow:none; color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs))}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:1.125rem;line-height:1.8;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,p{margin:0}
h1,h2,h3{color:var(--ink);text-wrap:balance;line-height:1.3;letter-spacing:-.015em}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:62px;padding-block:8px}
.course{position:relative;flex:none}
.course summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 10px 6px 6px;border-radius:12px}
.course summary::-webkit-details-marker{display:none}
.course summary:hover{background:var(--soft)}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:800;font-size:15px;flex:none}
.course b{display:block;font-size:1rem;color:var(--ink);font-weight:800;line-height:1.2}
.course small{display:block;font-size:.8rem;color:var(--muted);line-height:1.2}
.course .chev{color:var(--muted);font-size:.8rem;margin-left:2px}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:grid;gap:2px;z-index:8}
.menu a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:8px 10px;border-radius:10px;font-weight:600;font-size:.95rem}
.menu a:hover{background:var(--soft)}
.menu a i{width:10px;height:10px;border-radius:3px;flex:none}
.menu a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-deep)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.nav{display:flex;gap:2px;margin-left:6px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:700;font-size:.95rem}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current="true"]{color:var(--accent-deep);background:var(--accent-soft)}
.nav .cnt{font-family:var(--f-mono);font-size:.72rem;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.lv{background:var(--sun);color:var(--sun-ink);font-weight:800;padding:3px 10px;border-radius:999px;font-size:.86rem;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:800;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{border-color:var(--accent)}
.lprog{height:4px;background:var(--line)}
.lprog i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* course sidebar */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:30px;align-items:start;padding-block:26px 72px}
.shell > main{min-width:0}
.side{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 10px;box-shadow:var(--shadow);scrollbar-width:thin}
.side button{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:11px;padding:8px 10px;color:var(--text);font-size:.95rem;line-height:1.45}
.side button:hover{background:var(--soft);color:var(--ink)}
.side-home{font-weight:800;color:var(--ink)!important;font-size:1rem!important}
.side-home.on,.side-les.on,.side-tool.on{background:var(--accent-soft)!important;color:var(--accent-deep)!important}
.su-h{display:flex;align-items:center;gap:8px;margin:14px 10px 4px;font-size:.85rem;font-weight:800;color:var(--muted);letter-spacing:.01em}
.su-h span{flex:none;min-width:26px;height:22px;padding:0 6px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.78rem;font-family:"Times New Roman",serif}
.side-les i{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.75rem;font-weight:900;color:#fff}
.side-les.go i{border-color:var(--accent);color:var(--accent)}
.side-les.done i{background:var(--ok);border-color:var(--ok)}
.side-les small{display:block;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);line-height:1.2}
.side-les.on small{color:var(--accent-deep)}
.side-les span{min-width:0;font-weight:700}
.side-sec{margin:2px 0 8px 22px;padding-left:12px;border-left:2px solid var(--accent-soft);display:grid;gap:1px}
.side-sec a{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:.9rem;font-weight:600;color:var(--text);padding:6px 8px;border-radius:9px;line-height:1.4}
.side-sec a:hover{background:var(--soft)}
.side-sec a i{flex:none;width:17px;height:17px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.62rem;color:#fff}
.side-sec a.done i{background:var(--ok);border-color:var(--ok)}
.side-sec a.lock{color:var(--muted)}
.side-foot{border-top:1px solid var(--line);margin-top:12px;padding-top:8px;display:grid;gap:2px}
.side-tool{font-weight:700}
.side-tool .cnt{margin-left:auto;font-family:var(--f-mono);font-size:.78rem;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px}
.menu-btn{display:none}
.scrim{position:fixed;inset:0;background:rgba(8,20,30,.45);z-index:29}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:1rem;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:1.4rem;font-weight:800}
.sec-h small{color:var(--muted);font-size:.9rem}

/* home */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:36px;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;
  background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);border:1px solid var(--line)}
.hero > *{min-width:0;position:relative}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--accent) 18%,transparent) 1.5px,transparent 1.5px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent 40%,#000);pointer-events:none}
.eyebrow{font-size:.92rem;font-weight:800;color:var(--accent-deep);letter-spacing:.02em}
.hero h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:900;margin:8px 0 12px;letter-spacing:-.03em}
.hero .lead{color:var(--muted);max-width:44ch}
.hero-cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
.hero-cta small{color:var(--muted);font-size:.9rem}
.stairs{display:flex;align-items:flex-end;gap:5px;height:200px;z-index:1}
.stair{flex:1;height:calc(var(--h) * 100%);min-height:26px;border-radius:8px 8px 3px 3px;background:var(--surface);border:2px solid color-mix(in srgb,var(--accent) 35%,var(--line));display:flex;align-items:flex-start;justify-content:center;padding-top:5px;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);transition:background .3s}
.stair.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stair.cur{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.stat small{display:block;font-size:.9rem;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:1.5rem;color:var(--ink);font-weight:800;line-height:1.3}
.stat .bar{height:7px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:8px}
.stat .bar i{display:block;height:100%;background:var(--sun);border-radius:999px}
.flow{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flow li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.flow b{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-family:var(--f-mono)}
.flow strong{display:block;color:var(--ink);font-size:.98rem}
.flow span{font-size:.92rem;color:var(--muted);line-height:1.5}
.badges{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.badge .m{width:44px;height:44px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;border:2px dashed var(--line);color:var(--muted)}
.badge.on .m{border:0;background:var(--sun);color:var(--sun-ink);box-shadow:0 0 0 4px var(--sun-soft)}
.badge strong{display:block;font-size:.88rem;color:var(--ink);line-height:1.3}
.badge span{display:block;font-size:.8rem;color:var(--muted);line-height:1.35;margin-top:2px}
.badge:not(.on) strong{color:var(--muted)}
.units{display:grid;gap:22px}
.unit-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.unit-h .no{flex:none;min-width:40px;height:40px;padding:0 8px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.05rem;display:grid;place-items:center;font-family:"Times New Roman",serif}
.unit-h h3{font-size:1.2rem;font-weight:800}
.unit-d{color:var(--muted);font-size:.95rem;margin:-4px 0 12px}
.les-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.les{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;transition:border-color .15s,transform .15s;min-width:0}
.les:hover{border-color:var(--accent);transform:translateY(-1px)}
.les .th{flex:none;width:92px;height:68px;border-radius:11px;background:var(--soft);overflow:hidden}
.les .th img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.les .t{flex:1;min-width:0}
.les .code{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.les .t b{display:block;color:var(--ink);font-size:1.06rem;line-height:1.35}
.les .t small{display:block;color:var(--muted);font-size:.9rem;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:5px;align-items:center}
.dots i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots .score{margin-left:6px;font-size:.82rem;font-weight:800;color:var(--ok)}
.reset{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:.85rem;color:var(--muted);flex-wrap:wrap;margin-top:28px}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px;font-size:.85rem}

/* lesson */
.lmain{display:grid;gap:22px;min-width:0}
.crumb{font-size:.92rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb button{background:none;border:0;padding:0;color:var(--accent-deep);font-weight:700}
.l-head h1{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:900;margin:6px 0 4px;letter-spacing:-.03em}
.l-head .sub{color:var(--muted);font-size:1.05rem}
.tag{display:inline-block;font-size:.86rem;font-weight:800;color:var(--accent-deep);background:var(--accent-soft);padding:2px 10px;border-radius:999px;margin-bottom:10px}
.goals{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.goals li{padding-left:30px;position:relative}
.goals li::before{content:"✓";position:absolute;left:0;top:.15em;width:21px;height:21px;border-radius:7px;background:var(--accent-soft);color:var(--accent-deep);font-size:.75rem;font-weight:900;display:grid;place-items:center}
.story{background:var(--sun-soft);border:1px solid color-mix(in srgb,var(--sun) 40%,var(--line));border-radius:18px;padding:26px 28px}
.story .tag{background:var(--surface);color:var(--sun-ink)}
:root[data-theme="dark"] .story .tag{color:var(--sun)}
.story h2{font-size:1.25rem;margin-bottom:10px}
.story p{line-height:1.95;max-width:64ch}
.story p + p{margin-top:8px}
.story .q{margin-top:14px;font-weight:800;color:var(--ink)}
.media{display:grid;gap:14px}
.media > .tag{justify-self:start;margin-bottom:0}
.photo{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.photo img{width:100%;aspect-ratio:16/8;object-fit:cover;object-position:center 30%}
.photo figcaption{font-size:.82rem;color:var(--muted);padding:8px 14px}
.photo figcaption a{color:var(--muted)}
.videos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vid{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.vid .frame{aspect-ratio:16/9;position:relative;background:#000}
.vid .frame img{width:100%;height:100%;object-fit:cover;opacity:.92}
.vid .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .play{position:absolute;inset:0;display:grid;place-items:center;background:none;border:0;width:100%}
.vid .play span{width:64px;height:46px;border-radius:12px;background:#E3242B;display:grid;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.vid .play span::after{content:"";border-left:17px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.vid .len{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:4px}
.vid .info{padding:10px 14px 12px;display:grid;gap:2px}
.vid .info b{font-size:.92rem;color:var(--ink);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .info span{font-size:.86rem;color:var(--muted)}
.vid .info a{font-size:.86rem;font-weight:700;color:var(--accent-deep);text-decoration:none}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:.88rem;font-weight:700;text-decoration:none;color:var(--accent-deep);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.links a:hover{border-color:var(--accent)}
.pips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pip{font-size:.88rem;font-weight:700;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.pip.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pip.cur{border-color:var(--accent);color:var(--accent-deep)}
.steps{display:grid;gap:14px}
.step{scroll-margin-top:110px}
.step-h{display:flex;align-items:center;gap:10px}
.step-h b{flex:none;font-size:.85rem;font-weight:800;color:var(--accent-ink);background:var(--accent);padding:2px 10px;border-radius:999px}
.step-h h3{font-size:1.25rem;font-weight:800}
.step.locked{box-shadow:none;background:none;border-style:dashed;padding:14px 22px}
.step.locked .step-h b{background:var(--line);color:var(--muted)}
.step.locked h3{color:var(--muted);font-size:1rem}
.step.locked .note{color:var(--muted);font-size:.85rem}
.step ul{margin:12px 0 0;padding-left:20px;display:grid;gap:5px}
.step li::marker{color:var(--accent)}
.step .intro{margin-top:10px}
.key{margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--accent-soft);font-weight:600;color:var(--ink)}
.key b{color:var(--accent-deep);margin-right:6px}
.quiz{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.quiz .qq{font-weight:800;color:var(--ink);margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.98rem;transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .n{font-family:var(--f-mono);color:var(--muted);flex:none;font-size:.8rem;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:10px;font-size:.95rem}
.fb.ok{color:var(--ok);font-weight:600}
.fb.no{color:var(--bad)}
.sumlist{margin:0;padding-left:20px;display:grid;gap:6px}
.lock{color:var(--muted);font-size:.92rem}
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.match > div{display:grid;gap:8px;align-content:start;min-width:0}
.mc{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem;min-height:48px}
.mc.term{font-weight:800;color:var(--ink)}
.mc.sel{border-color:var(--accent);background:var(--accent-soft)}
.mc.got{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.mc.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tq{padding:16px 0;border-top:1px solid var(--line)}
.tq:first-of-type{border-top:0;padding-top:4px}
.tq .qq{font-weight:600;color:var(--ink);margin-bottom:10px}
.tq .qq .num{color:var(--accent-deep);margin-right:6px}
.result{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 18px;border-radius:14px;margin-bottom:8px}
.result.pass{background:var(--ok-soft)}
.result.fail{background:var(--bad-soft)}
.result .score{font-family:var(--f-mono);font-size:2rem;font-weight:700}
.result.pass .score{color:var(--ok)} .result.fail .score{color:var(--bad)}
.foot-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot-nav .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-weight:700}
.foot-nav .btn small{color:var(--muted);font-size:.75rem;font-weight:500}
.foot-nav .next{margin-left:auto;align-items:flex-end;text-align:right}
.pc{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.pc-in{display:flex;gap:8px;flex-wrap:wrap}
.tog{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:600}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tog .num{opacity:.75;margin-left:4px;font-size:.75rem}
.pc-out{margin-top:12px;font-size:.9rem;overflow-x:auto}
.pc-out .res{font-weight:800;color:var(--accent-deep)}
.mx{border-collapse:collapse;font-size:.9rem;width:100%}
.mx th,.mx td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.mx tr.best th{color:var(--accent-deep)}
.pc-res{margin-top:10px;font-size:.9rem}

/* glossary & review */
.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.search:focus{border-color:var(--accent);outline:0}
.gl-row{display:grid;grid-template-columns:200px 1fr auto;gap:16px;padding:14px 6px;border-bottom:1px solid var(--line);align-items:baseline}
.gl-row > *{min-width:0}
.gl-row strong{color:var(--ink)}
.gl-row button{background:none;border:0;color:var(--accent-deep);font-size:.85rem;font-weight:700;padding:0}
.rv{display:grid;gap:12px}
.rv .card{padding:18px 20px}
.rv .qq{font-weight:700;color:var(--ink)}
.rv .ans{margin-top:8px;color:var(--ok);font-weight:700}
.rv .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.85rem;color:var(--muted)}
.empty{padding:40px 0;color:var(--muted);text-align:center}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .25s}
.toast b{color:var(--sun)}
@keyframes up{from{transform:translateY(8px);opacity:0}}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:10px 16px 40px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1180px){ .badges{grid-template-columns:repeat(4,1fr)} }
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(330px,88vw);max-height:none;border-radius:0 20px 20px 0;z-index:30;transform:translateX(-105%);transition:transform .22s;padding:calc(14px + env(safe-area-inset-top,0px)) 10px calc(14px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  .side.open{transform:none}
  .menu-btn{display:grid}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding:24px}
  .stairs{height:120px}
  .stats,.flow{grid-template-columns:1fr 1fr}
  .les-list,.videos,.opts,.match{grid-template-columns:1fr}
  .gl-row{grid-template-columns:1fr;gap:2px}
  .story{padding:20px}
  .card{padding:18px}
  .top .wrap{flex-wrap:wrap}
  .nav{order:3;flex-basis:100%;margin-left:0}
  .course small{display:none}
}

 story:{title:"박물관의 나무 바퀴", p:["역사 체험 학습에서 서진이는 수천 년 전 메소포타미아의 나무 바퀴 모형 앞에 섰다. 바로 옆 전시실에는 전기차 배터리가 놓여 있었다.","“바퀴에서 전기차까지 얼마나 걸린 걸까?” 해설사가 답했다. “수천 년이요. 그런데 이제는 얼마나 빨리 만드느냐보다, 지구를 덜 아프게 만드는 게 더 큰 숙제랍니다.”"], q:"공학은 어떻게 발달해 왔고, 앞으로는 어디로 가야 할까요?"},
 steps:[
  {t:"고대에서 근대까지", li:["고대: 홍수를 막는 <b>치수</b>, 농사에 물을 대는 <b>관개</b>, 메소포타미아의 바퀴, 이집트 피라미드, 파로스 등대","로마 시대: 도로, 수로, 원형 경기장처럼 실용적인 공학이 발달했어요","르네상스(14세기 이후): 과학과 예술이 만난 공학, 금속 활자, 다빈치의 발명 스케치","17~19세기: 과학과 공학이 서로 도우며 진공 펌프, 와트의 증기 기관, 증기 기관차, 증기선이 나왔어요"],
   q:{q:"홍수를 막으려고 물을 관리하는 고대의 공학 기술은?", o:["관개","치수","측량","제련"], a:1, why:"치수는 물을 다스리는 것, 관개는 농사에 물을 대는 거예요."}},
  {t:"20세기 이후의 공학", li:["과학과 기술이 융합하면서 공학 분야가 크게 늘어났어요","건축·토목: 철강, 구조 역학, 엘리베이터로 초고층 건물과 긴 다리를 지어요","전자·컴퓨터: 최초의 전자식 컴퓨터 → 트랜지스터 → 개인용 컴퓨터 → 인터넷 → 스마트폰 → 인공 지능","화학: 석유 화학에서 신소재와 의약품으로 넓어졌어요","<b>로봇 공학</b>: 기계, 전기·전자, 컴퓨터 공학이 융합한 분야예요"], key:"20세기 공학의 핵심어는 ‘융합’이에요",
   q:{q:"로봇 공학에 대한 설명으로 알맞은 것은?", o:["기계·전자·컴퓨터 공학이 융합한 분야다","19세기 이전에 완성되었다","컴퓨터와는 관련이 없다","건물만 설계한다"], a:0, why:"로봇은 몸(기계), 신경(전자), 두뇌(컴퓨터)가 모두 필요해요."}},
  {t:"지속 가능한 미래 공학", li:["공학은 삶을 편리하게 했지만 자원 고갈과 환경 오염도 함께 가져왔어요","<b>지속 가능한 공학</b>: 에너지와 자원을 적게 쓰고 환경을 해치지 않도록 설계하고 운영하는 공학","실천 방법: <b>제품 사이클 분석</b>(원료 → 생산 → 사용 → 폐기 전 과정 살피기), 환경 친화적 설계, 자연 분해와 재활용을 고려한 설계","‘국경 없는 공학자’처럼 낙후 지역의 문제를 그 지역 실정에 맞게 푸는 공학도 있어요"],
   q:{q:"제품의 원료 채취부터 폐기까지 전 과정을 살펴 환경 영향을 줄이는 방법은?", o:["제품 사이클 분석","역공학","브레인라이팅","쌍비교 분석"], a:0, why:"제품의 한살이 전체를 따져 보는 방법이에요."}}
 ],
 summary:["고대에는 치수, 관개, 바퀴, 피라미드처럼 자연을 이겨 내는 공학이 발달했어요.","로마는 실용 공학, 르네상스는 과학과 예술의 결합, 17세기 이후는 과학과 공학의 협력이 특징이에요.","20세기 이후 공학은 융합을 통해 컴퓨터, 로봇, 신소재 등으로 넓어졌어요.","앞으로의 공학은 자원과 환경을 지키는 지속 가능한 공학이어야 해요."],

  {q:"로마 시대 공학의 특징으로 알맞은 것은?", o:["도로, 수로 같은 실용적인 공학이 발달했다","컴퓨터가 등장했다","인공 지능이 발달했다","공학이 전혀 없었다"], a:0},

  {q:"17세기 이후 공학과 과학의 관계로 옳은 것은?", o:["서로 도우며 함께 발전했다","완전히 분리되었다","과학만 발달했다","공학이 과학을 막았다"], a:0},
  {q:"초고층 건물을 지을 수 있게 된 바탕이 아닌 것은?", o:["철강 재료","구조 역학","엘리베이터","관개 수로"], a:3},

{id:"2-1", unit:"2", title:"창의 공학 설계와 문제 해결 과정", sub:"막연한 불편을 해결책으로 바꾸는 9단계",
 goals:["창의 공학 설계의 의미를 설명할 수 있다.","형태 설계와 기능 설계를 구분할 수 있다.","공학 설계 과정 9단계를 문제 해결에 적용할 수 있다."],
 story:{title:"식어 버린 핫초코", p:["겨울 아침, 예린이는 매점에서 산 핫초코를 들고 교실에 들어왔다. 1교시가 끝나고 한 모금 마시자 이미 미지근했다. 짝꿍이 말했다. “더 두꺼운 컵을 사면 되잖아.”","예린이는 고개를 저었다. 두꺼운 컵은 가방에 안 들어가고 무거웠다. 정말 필요한 게 무엇인지부터 다시 따져 봐야 했다."], q:"진짜 문제를 찾고 해결책을 만드는 체계적인 방법은 무엇일까요?"},
 steps:[
  {t:"창의 공학 설계란", li:["문제를 창의적으로 해결하려고 체계적이고 과학적인 방법으로 설계하는 것이에요","<b>설계</b>는 아이디어를 구체화한 것으로, 도면뿐 아니라 과정, 계획, 방법을 모두 포함해요","공학 설계는 해결할 문제가 중심이고, <b>예술적 설계</b>는 아름다움을 바라는 마음이 중심이에요","<b>형태 설계</b>는 생김새와 모양을, <b>기능 설계</b>는 어떻게 작동하는지를 정해요. 요즘은 형태의 가치도 커지고 있어요"],
   q:{q:"제품이 어떻게 작동할지를 정하는 설계는?", o:["형태 설계","기능 설계","예술적 설계","도면 복사"], a:1, why:"작동 방식은 기능 설계, 생김새는 형태 설계예요."}},
  {t:"창의 공학 설계의 특징", li:["문제가 겉으로 잘 드러나지 않는 경우가 많아요","그래서 사용자의 처지에서 문제를 정확히 이해하는 일이 먼저예요","해결책은 하나가 아니라 여러 가지일 수 있어요","문제가 해결될 때까지 과정을 <b>되풀이</b>하고, 상황에 따라 앞 단계로 돌아가거나 건너뛸 수도 있어요"], key:"문제를 잘못 이해하면 엉뚱한 해결책이 나와요",
   q:{q:"창의 공학 설계의 특징으로 옳지 않은 것은?", o:["해결책이 여러 가지일 수 있다","문제가 해결될 때까지 되풀이한다","정해진 순서를 절대 바꿀 수 없다","사용자 처지에서 문제를 이해한다"], a:2, why:"상황에 따라 앞 단계로 돌아가거나 단계를 건너뛸 수 있어요."}},
  {t:"공학 설계 과정 9단계", li:["<b>1 문제 상황</b> 확인 → <b>2 사용자 공감</b>(직접 체험, 관찰, 인터뷰) → <b>3 문제 정의</b>","<b>4 관련 정보 수집</b> → <b>5 해결 방법 탐색</b>(브레인스토밍, 마인드맵) → <b>6 대안 선정</b>(평가 행렬법 같은 수렴적 사고)","<b>7 설계</b>(도면, 컴퓨터 설계) → <b>8 시제품 제작</b>(모형, 3D 프린팅) → <b>9 평가 및 성찰</b>","문제 정의 문장 틀: “우리가 만약 (조건) 속에서 (당사자)를 위해 (해결책)을 하게 된다면 (결과)하게 될 것이다.”"],
   q:{q:"사용자의 처지에서 직접 체험하거나 관찰·인터뷰하는 단계는?", o:["사용자 공감","시제품 제작","대안 선정","관련 정보 수집"], a:0, why:"사용자 공감 단계에서 문제를 쓰는 사람의 눈으로 다시 봐요."}}
 ],
 summary:["창의 공학 설계는 문제를 창의적으로 풀려고 체계적·과학적으로 설계하는 과정이에요.","설계에는 도면뿐 아니라 과정, 계획, 방법이 모두 들어가요.","형태 설계는 모양을, 기능 설계는 작동 방식을 정해요.","문제 상황부터 평가 및 성찰까지 9단계를 해결될 때까지 되풀이해요."],
 cards:[["설계","아이디어를 구체화한 것으로 과정, 계획, 방법을 포함함"],["형태 설계","제품의 생김새와 모양을 정하는 설계"],["기능 설계","제품이 어떻게 작동할지를 정하는 설계"],["사용자 공감","사용자의 처지에서 체험·관찰·인터뷰로 문제를 이해하기"],["시제품","해결책을 시험하려고 먼저 만들어 보는 제품"]],
 test:[
  {q:"‘설계’에 대한 설명으로 옳은 것은?", o:["아이디어를 구체화한 것으로 과정·계획·방법을 포함한다","도면만을 뜻한다","완성된 제품만을 뜻한다","예술 작품만을 뜻한다"], a:0},
  {q:"공학 설계와 예술적 설계의 차이로 알맞은 것은?", o:["공학 설계는 해결할 문제가 중심이다","예술적 설계는 기능이 중심이다","둘은 완전히 같다","공학 설계는 모양을 전혀 고려하지 않는다"], a:0},
  {q:"여러 아이디어 가운데 가장 알맞은 해결책을 고르는 단계는?", o:["대안 선정","문제 상황","사용자 공감","관련 정보 수집"], a:0},
  {q:"해결책을 시험하려고 간단한 모형이나 3D 출력물을 만드는 단계는?", o:["시제품 제작","문제 정의","해결 방법 탐색","사용자 공감"], a:0},
  {q:"‘해결 방법 탐색’ 단계에서 주로 쓰는 기법은?", o:["브레인스토밍","제품 출시","도면 인쇄","가격 책정"], a:0},
  {q:"평가 결과 문제가 해결되지 않았다면?", o:["앞 단계로 돌아가 과정을 되풀이한다","그대로 완성한다","해결책을 숨긴다","사용자 탓으로 돌린다"], a:0},
  {q:"공학 설계 과정 9단계의 첫 단계는?", o:["문제 상황 확인","설계","시제품 제작","평가 및 성찰"], a:0}

{id:"2-2", unit:"2", title:"창의 공학 설계의 가치와 영향", sub:"더 나은 해결책이 세상을 바꾸는 방식",
 goals:["창의 공학 설계가 중요한 까닭을 설명할 수 있다.","창의 공학 설계가 쓰이는 여러 분야를 말할 수 있다.","창의적 문제 해결에 필요한 태도를 기를 수 있다."],
 story:{title:"반응 없는 터치 버튼", p:["할머니 댁 아파트에 새 엘리베이터가 생겼다. 버튼이 매끈한 터치 화면으로 바뀌어 멋져 보였다. 그런데 할머니는 장갑 낀 손으로 몇 번을 눌러도 반응이 없어 결국 계단으로 걸어 올라가셨다.","지우는 생각했다. “멋진 것만으로는 부족하구나. 쓰는 사람의 처지가 되어 봐야 진짜 좋은 설계가 나오겠어.”"], q:"창의 공학 설계는 왜 중요하고, 어떤 태도가 필요할까요?"},
 steps:[
  {t:"창의 공학 설계가 중요한 까닭", li:["공학은 수학, 과학, 기술 지식을 바탕으로 문제를 풀어요","창의 공학 설계는 이 전문성에 창의적인 발상을 더해 문제를 해결하는 과정이에요","일상 문제에도 쓸모가 있어요. 문제 확인, 사용자 공감, 문제 정의로 문제의 핵심을 찾아 줘요","교육, 업무, 예술, 과학 등 여러 분야에서 <b>융합</b>적 문제 해결에 쓰여요"],
   q:{q:"창의 공학 설계에 대한 설명으로 옳은 것은?", o:["공학 분야에서만 쓰인다","일상생활과 여러 분야의 문제 해결에도 쓰인다","창의성은 필요 없다","정보 수집 단계가 없다"], a:1, why:"교육, 업무, 예술, 과학 등 다양한 분야에서 쓰여요."}},
  {t:"새로운 기술과 설계", li:["<b>인공 지능</b>: 수많은 구조를 분석해 안전하고 효율적인 설계안을 자동으로 만들고, 되풀이 작업을 줄여 줘요","다만 규범과 안전 요건을 완벽히 따지기에는 아직 한계가 있어서 사람을 돕는 수준으로 쓰여요","<b>블록체인</b>: 암호화한 정보를 사슬처럼 이어 여러 서버에 나눠 기록해 위조와 변조를 어렵게 해요","활용: 스마트 계약, 신원 인증, 금융"],

{id:"3-1", unit:"3", title:"공학자의 눈으로 본 창의성", sub:"새롭기만 해서는 안 되는 공학의 창의성",
 goals:["창의성의 네 요소를 설명할 수 있다.","공학 제품의 창의성을 평가하고 그 가치를 말할 수 있다.","창의적인 공학자에게 필요한 역량을 설명할 수 있다."],
 story:{title:"구멍 뚫린 장화", p:["디자인 공모전에 발가락 쪽이 뚫린 ‘통풍 장화’가 나왔다. 모양은 정말 새로웠다. 심사 위원 한 명이 웃으며 물었다. “그런데 비 오는 날 신으면 어떻게 되죠?”","참가자는 대답하지 못했다. 그 장화는 결국 상을 받지 못했다. 새롭다는 것만으로는 공학에서 창의적이라고 부르기 어려웠다."], q:"공학에서 말하는 ‘창의성’은 무엇이 다를까요?"},
 steps:[
  {t:"창의성의 네 요소", li:["<b>창의성</b>: 새로운 생각을 찾거나 기존 생각을 조합해 새롭게 만들어 내는 특성","<b>유창성</b>: 아이디어를 최대한 많이, 빠르게 떠올리기","<b>융통성</b>: 기존과 다른 용도로 생각하기 (휴대 전화를 음악 재생기로)","<b>독창성</b>: 새롭고 독특한 아이디어 내기","<b>정교성</b>: 거친 아이디어를 섬세하게 다듬기"],
   q:{q:"‘휴대 전화로 할 수 있는 일을 1분 동안 30가지 적기’와 가장 관련 있는 요소는?", o:["유창성","정교성","독창성","융통성"], a:0, why:"많이, 빠르게 떠올리는 힘이 유창성이에요."}},
  {t:"공학의 창의성과 평가", li:["공학의 창의성은 <b>독창성과 실용성</b>을 함께 갖춰야 해요. 물을 뿌릴 수 없는 물뿌리개는 새로워도 창의적인 공학 제품이 아니에요","평가 요소: 독특성, 매력성, 기능성, 변화 가능성, 발전성, 만족성","창의적인 공학 제품의 가치: 사회 문제 해결, 새로운 시장 개척, 제품 차별화와 경쟁력, 산업 성장과 일자리 창출"], key:"공학의 창의성은 새로움에 쓸모가 더해져야 해요",
   q:{q:"공학 제품의 창의성 평가에서 ‘소비자의 요구를 충족하는가’를 보는 요소는?", o:["만족성","독특성","매력성","발전성"], a:0, why:"사용자가 만족하는지를 보는 것이 만족성이에요."}},
  {t:"창의적인 공학자의 역량", li:["공학 지식 능력, 문제 발견력, 관찰력, 탐구력","융합적 사고력, 독창적 사고력, 분석적 사고력, 문제 해결력, 협업 능력. 특히 융합과 협업이 더 중요해지고 있어요","<b>심리적 관성</b>: 익숙한 방식만 이어 가고 새로운 생각을 피하려는 성질, 고정 관념과 비슷해요","이겨 내려면 다른 시각으로 보고, 실패를 두려워하지 않고, 사회 문제에 관심을 가져요"],
   q:{q:"‘늘 하던 방식이 편해서 새 방법을 시도하지 않는 것’을 무엇이라 하나요?", o:["심리적 관성","융통성","협업 능력","정교성"], a:0, why:"익숙한 쪽으로 계속 가려는 성질이라 ‘관성’이라고 불러요."}}

{id:"3-2", unit:"3", title:"공학 문제 해결을 돕는 사고 기법", sub:"아이디어를 넓히는 생각, 좁히는 생각",
 goals:["확산적 사고 기법으로 아이디어를 많이 만들 수 있다.","수렴적 사고 기법으로 아이디어를 평가하고 고를 수 있다.","상황에 맞는 사고 기법을 고를 수 있다."],
 story:{title:"축제 부스 회의", p:["학교 축제 부스를 정하는 회의. 첫 의견이 나오자마자 누군가 “그건 별로야”라고 말했다. 그 뒤로 아무도 입을 열지 않았다.","다음 날 반장은 규칙을 바꿨다. 30분 동안은 어떤 의견도 비판 금지, 대신 많이 내기. 칠판이 아이디어로 가득 찼다. 이제 남은 문제는 그중 하나를 어떻게 고르느냐였다."], q:"아이디어를 많이 내는 방법과 잘 고르는 방법은 어떻게 다를까요?"},
 steps:[
  {t:"브레인스토밍과 브레인라이팅", li:["<b>확산적 사고</b>: 아이디어를 넓게, 많이 펼치는 생각","<b>브레인스토밍</b>의 4원칙: 비판 보류, 어떤 아이디어도 환영, 질보다 양, 아이디어 결합·개선","<b>브레인라이팅</b>: 같은 원칙을 따르되 아이디어를 종이에 적고 돌려 가며 덧붙여요","<b>마인드맵</b>: 핵심 아이디어에서 가지를 뻗어 연관 아이디어를 만들어요"],
   q:{q:"브레인스토밍의 원칙이 아닌 것은?", o:["비판 보류","질보다 양","아이디어 결합·개선","좋은 의견만 골라 말하기"], a:3, why:"고르는 일은 나중에 하고, 우선 많이 내는 것이 원칙이에요."}},
  {t:"아시트, 스캠퍼, 기회의 원", li:["<b>아시트(ASIT)</b>: 트리즈를 쉽게 만든 기법. 용도 변경, 대칭 파괴, 제거, 분할, 복제의 5가지 방법 (줄을 없앤 무선 이어폰은 ‘제거’)","<b>스캠퍼(SCAMPER)</b>: 대체, 결합, 응용, 변형·확대·축소, 다른 용도, 제거, 뒤집기·재배열의 7가지 질문","<b>기회의 원</b>: 원에 1~12번 속성을 적고 주사위로 두 속성을 골라 억지로 이어 보며 아이디어를 얻어요"],
   q:{q:"이어폰 줄을 없애 무선 이어폰을 만든 것은 아시트의 어떤 방법인가요?", o:["제거","복제","분할","대칭 파괴"], a:0, why:"불필요한 부분을 없애 문제를 푸는 방법이 제거예요."}},
  {t:"아이디어 고르기: 수렴적 사고", li:["<b>수렴적 사고</b>: 펼친 아이디어 가운데 가장 알맞은 것을 고르는 생각","<b>PMI</b>: 좋은 점(Plus), 나쁜 점(Minus), 흥미로운 점(Interesting)으로 평가","<b>평가 행렬법</b>: 시간, 비용, 재료 같은 기준표로 아이디어를 점수화","<b>스크리닝 매트릭스</b>: 두 기준(예: 심미성, 기능성)의 상·중·하 칸에 나눠 우선순위 정하기","<b>쌍비교 분석법</b>: 아이디어를 둘씩 비교해 더 중요한 쪽에 1~3점을 주고 총점으로 순위 매기기"], widget:"matrix", key:"넓히고(확산) 나서 좁혀요(수렴)",
   q:{q:"아이디어를 좋은 점, 나쁜 점, 흥미로운 점으로 나누어 평가하는 기법은?", o:["PMI 기법","스캠퍼","기회의 원","브레인라이팅"], a:0, why:"Plus, Minus, Interesting의 머리글자예요."}}
 ],
 summary:["확산적 사고는 아이디어를 넓게, 수렴적 사고는 알맞은 것을 고르는 생각이에요.","브레인스토밍은 비판 보류, 어떤 아이디어도 환영, 질보다 양, 결합·개선을 지켜요.","아시트는 5가지, 스캠퍼는 7가지 방법으로 아이디어를 체계적으로 만들어요.","PMI, 평가 행렬법, 스크리닝 매트릭스, 쌍비교 분석법으로 아이디어를 평가해요."],

{id:"4-1", unit:"4", title:"공학과 팀워크 리더십", sub:"뛰어난 개인보다 강한 팀",
 goals:["팀과 팀워크의 의미를 설명할 수 있다.","팀 운영 계획을 만들 수 있다.","팀 발달 4단계의 특징을 설명할 수 있다."],
 story:{title:"에이스만 모은 로봇 팀", p:["로봇 대회에 우리 학교는 학년 1등들만 모아 팀을 만들었다. 다들 실력이 뛰어났지만 첫 회의부터 서로 자기 설계가 맞다며 세 시간을 다퉜다.","결국 시간 안에 로봇을 완성하지 못했다. 우승은 평범한 학생들이 모인 옆 학교 팀이었다. 그 팀의 비결은 ‘역할 나누기 표’ 한 장이었다."], q:"좋은 팀은 무엇이 다를까요?"},
 steps:[
  {t:"팀과 팀워크", li:["<b>팀</b>: 공동의 목표를 이루려고 서로 다른 개성과 능력을 가진 사람이 모여 협력하는 집단","<b>팀워크</b>: 팀원이 각자 역할을 하며 협력해 공동 목표를 이루는 것","핵심 요소: 협업, 책임 공유, 성과 창출, 역량의 조화","팀으로 일하면 품질과 생산성이 오르고, 여러 요소를 고려한 의사 결정과 빠른 변화 적응이 가능해요"],
   q:{q:"팀에 대한 설명으로 알맞은 것은?", o:["공동의 목표를 위해 협력하는 집단","같은 능력의 사람만 모인 집단","각자 다른 목표를 가진 모임","리더 혼자 일하는 집단"], a:0, why:"서로 다른 사람이 같은 목표를 위해 협력하는 것이 팀이에요."}},
  {t:"팀 운영 계획", li:["팀을 꾸리면 가장 먼저 방향과 목표를 정해요","팀 운영 계획에 담을 것: <b>임무 진술</b>(왜 이 팀이 있는가, 한 문장), <b>팀 목표</b>(구체적으로 이룰 것), <b>과제 할당</b>(누가 무엇을), <b>수행 일정</b>(언제까지)","계획은 팀원 모두가 토의해 함께 만들고 합의해요","리더십은 타고나는 것만이 아니라 길러질 수 있어요"],
   q:{q:"팀 운영 계획에 꼭 담을 정보가 아닌 것은?", o:["팀의 임무 진술","과제 할당","수행 일정","팀원의 시험 성적"], a:3, why:"임무, 목표, 과제 할당, 일정이 팀 운영 계획의 네 기둥이에요."}},
  {t:"팀은 이렇게 자라요", li:["<b>형성기</b>: 서로 알아 가며 역할을 궁금해하고 리더에게 많이 기대요","<b>격동기</b>: 의견과 이해관계가 부딪혀 갈등이 생겨요","<b>규범기</b>: 서로 믿고 공동 목표로 뭉치며 의견 차이를 존중해요","<b>성취기</b>: 지시 없이도 각자 역할을 해내며 성과가 가장 커져요","<b>아폴로 신드롬</b>: 뛰어난 인재만 모인 팀이 서로 주장만 하다 오히려 성과가 낮아지는 현상"], key:"형성기 → 격동기 → 규범기 → 성취기",
   q:{q:"팀원들이 지시 없이도 역할을 스스로 해내며 성과가 가장 커지는 단계는?", o:["형성기","격동기","규범기","성취기"], a:3, why:"신뢰와 자율이 자리 잡은 마지막 단계가 성취기예요."}}
 ],
 summary:["팀은 공동 목표를 위해 서로 다른 사람이 협력하는 집단이에요.","팀 운영 계획에는 임무 진술, 목표, 과제 할당, 수행 일정이 들어가요.","팀은 형성기, 격동기, 규범기, 성취기를 거쳐 자라요.","뛰어난 사람만 모여도 협력하지 않으면 아폴로 신드롬이 생겨요."],
 cards:[["팀워크","각자 역할을 하며 협력해 공동 목표를 이루는 것"],["팀 운영 계획","임무, 목표, 과제 할당, 일정을 담은 팀의 계획"],["격동기","의견과 이해관계가 부딪혀 갈등이 생기는 단계"],["아폴로 신드롬","인재만 모인 팀이 다투다 성과가 낮아지는 현상"]],
 test:[

  {q:"의견과 이해관계가 충돌해 갈등이 생기기 쉬운 단계는?", o:["격동기","형성기","규범기","성취기"], a:0},
  {q:"팀원들이 리더에게 많이 기대고 자기 역할을 궁금해하는 단계는?", o:["형성기","격동기","규범기","성취기"], a:0},
  {q:"잘 쓴 팀 임무 진술의 특징은?", o:["왜 팀이 존재하는지 한 문장으로 간략히 밝힌다","방법을 길고 자세히 적는다","팀원 이름만 적는다","일정만 적는다"], a:0},
  {q:"아폴로 신드롬과 가장 가까운 속담은?", o:["사공이 많으면 배가 산으로 간다","티끌 모아 태산","가는 말이 고와야 오는 말이 곱다","원숭이도 나무에서 떨어진다"], a:0},
  {q:"팀 운영 계획은 어떻게 만드는 것이 바람직한가요?", o:["팀원 모두가 토의해 함께 만들고 합의한다","리더 혼자 정해 알린다","만들지 않는다","선생님이 대신 쓴다"], a:0},
  {q:"팀으로 일할 때의 장점이 아닌 것은?", o:["품질과 생산성 향상","여러 요소를 고려한 의사 결정","변화에 빠른 적응","책임이 한 사람에게만 몰림"], a:3}
 ]},

{id:"4-2", unit:"4", title:"갈등 관리와 팀 의사소통", sub:"다툼을 성장으로 바꾸는 대화법",
 goals:["팀 갈등의 원인과 커지는 과정을 설명할 수 있다.","갈등 관리의 다섯 유형을 구분할 수 있다.","경청의 중요성과 사회적 태만을 설명할 수 있다."],
 story:{title:"아무도 안 만든 발표 자료", p:["모둠 과제 마감 하루 전, 발표 자료는 반도 채워지지 않았다. 다들 “누군가 하겠지”라고 생각했던 것이다. 단톡방에는 서로를 탓하는 말만 올라왔다.","그때 한 친구가 말했다. “누구 잘못인지 따지기 전에, 각자 뭐가 힘들었는지 먼저 들어 보자.” 이야기를 나누다 보니 문제는 사람이 아니라 정하지 않은 역할이었다."], q:"팀 안의 갈등은 왜 생기고, 어떻게 풀 수 있을까요?"},
 steps:[
  {t:"팀 갈등은 왜 생길까", li:["팀원의 요구와 팀의 요구가 다를 때","문제 해결에 필요한 자원이 부족할 때","신념, 가치, 개인 사정이 서로 다를 때","의사소통이 원활하지 않을 때, 리더가 역할을 못 하거나 의견을 존중하지 않을 때","갈등은 <b>차이점</b> → <b>부조화</b> → <b>갈등</b> 순서로 커져요"], key:"갈등은 자연스러운 것, 문제는 내버려 두는 것",
   q:{q:"팀 갈등이 커지는 과정을 순서대로 나열한 것은?", o:["차이점 → 부조화 → 갈등","갈등 → 차이점 → 부조화","부조화 → 갈등 → 차이점","갈등 → 부조화 → 차이점"], a:0, why:"작은 차이가 마찰(부조화)을 거쳐 갈등으로 커져요."}},
  {t:"갈등 관리의 다섯 유형", li:["두 기준: 내 주장을 얼마나 내세우나(자기 중심), 상대를 얼마나 배려하나(상대방 중심)","<b>강요형</b>: 내 주장만 강해요 / <b>회피형</b>: 둘 다 낮아 피해요 / <b>양보형</b>: 상대에게 맞춰요","<b>타협형</b>: 서로 조금씩 물러나요 / <b>협력형</b>: 둘 다 높아 모두 만족하는 해결을 찾아요","부정적인 생각을 긍정적인 ‘선언문’으로 바꾸는 <b>생각의 전환</b>도 도움이 돼요"],
   q:{q:"자기 주장과 상대 배려가 모두 높아 함께 최선의 해결책을 찾는 유형은?", o:["강요형","회피형","협력형","양보형"], a:2, why:"나도 너도 중요하게 여기는 유형이 협력형이에요."}},
  {t:"의사소통과 경청", li:["소통을 강화하는 원칙: 명확하고 간결한 메시지, 다양한 소통 도구, 피드백 주고받기, 효과적인 경청","<b>경청</b>은 신뢰와 존중을 보여 주고, 갈등을 막고, 창의성을 높여요","<b>공감적 경청</b>: 상대 중심으로, 단어가 아니라 맥락까지 듣기","<b>링겔만 효과(사회적 태만)</b>: 사람이 많아질수록 한 사람의 노력이 줄어드는 현상, 무임승차의 원인이에요"],
   q:{q:"줄다리기 인원이 늘수록 한 사람이 쓰는 힘이 줄어드는 현상은?", o:["링겔만 효과","아폴로 신드롬","심리적 관성","트레이드오프"], a:0, why:"책임이 흩어지면 ‘나 하나쯤이야’ 하는 마음이 생겨요."}}
 ],
 summary:["팀 갈등은 요구 차이, 자원 부족, 신념 차이, 소통 부족, 리더십 문제에서 생겨요.","갈등은 차이점, 부조화, 갈등 순서로 커지니 일찍 다루는 것이 좋아요.","갈등 관리 유형에는 강요형, 회피형, 양보형, 타협형, 협력형이 있어요.","공감적 경청과 분명한 역할 나누기로 사회적 태만을 줄여요."],
 cards:[["부조화","팀원 사이 마찰로 시간이 낭비되고 목표를 벗어나는 단계"],["협력형","자기 주장과 상대 배려가 모두 높은 갈등 관리 유형"],["공감적 경청","상대 중심으로 맥락까지 이해하며 듣기"],["링겔만 효과","인원이 늘수록 개인의 노력이 줄어드는 현상"]],
 test:[
  {q:"팀 갈등의 원인으로 보기 어려운 것은?", o:["팀원 모두가 같은 목표를 분명히 공유할 때","자원이 부족할 때","의사소통이 원활하지 않을 때","팀원과 팀의 요구가 다를 때"], a:0},
  {q:"팀 갈등에 대한 생각으로 옳은 것은?", o:["갈등은 팀 활동에서 자연스럽게 생길 수 있다","갈등이 없으면 무조건 훌륭한 팀이다","갈등은 무시하는 것이 최선이다","갈등은 항상 모두가 만족하게 끝난다"], a:0},
  {q:"자기 주장과 상대 배려가 모두 낮아 갈등 자체를 피하는 유형은?", o:["회피형","협력형","강요형","타협형"], a:0},
  {q:"의사소통을 강화하는 원칙이 아닌 것은?", o:["명확하고 간결한 메시지","서로 피드백 주고받기","효과적인 경청","내 말만 길게 하기"], a:3},
  {q:"경청의 효과로 알맞지 않은 것은?", o:["갈등 예방","신뢰와 존중 표현","창의성 촉진","팀원의 의견 무시"], a:3},
  {q:"사회적 태만이 생기는 까닭은?", o:["여럿이 하면 책임이 흩어져 개인 노력이 드러나지 않아서","사람이 적어서","과제가 너무 쉬워서","리더가 너무 많아서"], a:0},
  {q:"부정적인 생각을 현재형 긍정 문장으로 바꿔 되뇌는 방법은?", o:["선언문을 이용한 생각의 전환","브레인라이팅","역공학","평가 행렬법"], a:0}

{id:"5-1", unit:"5", title:"공학적 산출물의 비교·분석", sub:"이미 있는 제품 속에 다음 아이디어가 숨어 있어요",
 goals:["공학 산출물의 물리적 속성과 기능적 속성을 구분할 수 있다.","비교·분석과 역공학이 필요한 까닭을 설명할 수 있다.","평가 행렬법, 기능 트리, 가치 엔지니어링을 활용할 수 있다."],

 steps:[
  {t:"물리적 속성과 기능적 속성", li:["<b>물리적 속성</b>: 재질과 구조 (가벼운 나무 의자, 천과 스펀지 쿠션)","<b>기능적 속성</b>: 용도와 기능. 등받이에 기대기는 의도한 기능, 등받이에 가방 걸기는 의도하지 않은 기능이에요","비교·분석이 필요한 까닭: 기존 제품에서 새 해결 방법을 얻고, 자연과 기존 산출물을 본떠 아이디어를 쉽게 얻으며, 확산적·수렴적 사고 모두에 쓸 수 있어요"],
   q:{q:"의자 등받이에 가방을 걸어 두는 것은 무엇에 해당하나요?", o:["물리적 속성","의도한 기능적 속성","의도하지 않은 기능적 속성","제품 사이클"], a:2, why:"설계자가 생각하지 않았던 쓰임새라 의도하지 않은 기능이에요."}},
  {t:"역공학", li:["보통은 설계 → 생산 순서지만, <b>역공학</b>은 제품을 분해해 그 속에서 아이디어를 찾아 설계에 반영해요","부품을 비교·분석하면 적용된 기술과 문제점을 찾기 쉬워요","주의: 특허 기술 유출이나 저작권 침해 문제가 생길 수 있어요","3D 스캐너로 문화재의 3차원 도면을 만들어 복원할 때도 쓰여요"],
   q:{q:"역공학에 대한 설명으로 옳은 것은?", o:["완성된 제품을 분해해 구조와 기술을 분석한다","도면 없이 바로 판매한다","새 재료를 발명하는 일이다","팀을 나누는 방법이다"], a:0, why:"만드는 순서를 거꾸로 따라가 보는 것이 역공학이에요."}},
  {t:"분석 도구 세 가지", li:["<b>평가 행렬법</b>: 구성 요소(세로) × 평가 기준(가로: 비용, 사용 편의성, 고장 빈도 등)으로 점수를 매겨 낮은 점수부터 개선해요","<b>기능 트리</b>: 상위 기능(휴대 전화의 통화·메시지)에서 세부 기능(전화 걸기, 문자 보내기)으로 가지를 뻗어 정리해요","<b>가치 엔지니어링</b>: 핵심 가치(예: 전기차의 안전, 주행 거리)를 정하고 필요 없는 기능은 빼서 비용을 줄이고 핵심 기능을 높여요"], key:"분해하고, 점수 매기고, 핵심에 집중해요",

{id:"5-2", unit:"5", title:"제품 개발 연구의 실제", sub:"아이디어가 진짜 제품이 되기까지",
 goals:["제품 개발에서 따질 여섯 가지 기준을 설명할 수 있다.","실제 제품 개발 과정을 설명할 수 있다.","공학자가 지켜야 할 윤리 규범을 말할 수 있다."],

   q:{q:"‘어린이가 써도 다칠 위험이 없는가?’는 어떤 기준인가요?", o:["안전 기준","비용적 기준","시간적 기준","환경 기준"], a:0, why:"사용자가 다치지 않는지를 따지는 것이 안전 기준이에요."}},

   q:{q:"제품을 정식으로 만들기 전에 성능을 시험하려고 만드는 것은?", o:["시제품","완제품","설계도","특허"], a:0, why:"시제품으로 시험하고 고친 뒤에 출시해요."}},

   q:{q:"시험 결과가 기대에 못 미치자 수치를 조금 높여 보고했다. 어긋난 윤리 규범은?", o:["진실성과 투명성","개인 정보 보호","환경 보호","지식 재산권 보호"], a:0, why:"결과를 정직하게 보고하는 것이 진실성과 투명성이에요."}}

{id:"6-1", unit:"6", title:"아이디어의 시각화", sub:"머릿속 생각을 누구나 읽는 그림으로",
 goals:["스케치와 제도의 차이를 설명할 수 있다.","도면에 쓰는 선의 종류와 용도를 구분할 수 있다.","투상법 네 가지의 특징을 설명할 수 있다."],
 story:{title:"말로만 설명한 책꽂이", p:["목공 동아리 시간, 도현이는 만들고 싶은 책꽂이를 친구에게 말로 설명했다. “아래는 넓고, 위로 갈수록 좁아지고, 옆에 작은 칸이…” 친구가 만든 책꽂이는 전혀 다른 모양이었다.","선생님이 연필과 모눈종이를 건넸다. “공학자는 말 대신 약속된 그림으로 대화해. 그래야 누가 봐도 같은 물건을 떠올리지.”"], q:"아이디어를 정확하게 전달하는 그림은 어떻게 그릴까요?"},
 steps:[
  {t:"스케치와 제도", li:["설계는 선, 문자, 기호로 아이디어를 구체화하고 소통하는 과정이에요. 스케치, 제도, 컴퓨터 기반 설계로 나뉘어요","<b>스케치</b>: 형태와 특징을 빠르게 대략 그리기, 주로 연필로 해요","<b>프리핸드 스케치</b>: 자 같은 제도 도구 없이 손과 연필만으로 그리기","선 긋기: 가로선은 왼쪽에서 오른쪽, 세로선은 위에서 아래로, 짧은 선을 가볍게 겹쳐 윤곽을 잡아요"],
   q:{q:"제도 도구 없이 종이, 연필, 지우개만으로 그리는 스케치는?", o:["프리핸드 스케치","등각 투상도","청사진","정투상도"], a:0, why:"‘프리핸드’는 자유로운 손이라는 뜻이에요."}},

{id:"6-2", unit:"6", title:"2D·3D 설계와 가공", sub:"레이저로 자르고, 층층이 쌓아 만들기",
 goals:["레이저 절단기의 원리와 가공 방식을 설명할 수 있다.","3D 프린터의 세 가지 방식을 구분할 수 있다.","3D 모델링부터 출력까지의 과정을 설명할 수 있다."],
 story:{title:"동아리 이름표와 마스코트", p:["발명 동아리는 축제 부스에 걸 나무 이름표와 작은 마스코트 인형을 직접 만들기로 했다. 이름표는 얇은 MDF 판으로, 마스코트는 둥글고 입체적인 모양이었다.","“이름표는 레이저 절단기로 자르면 되겠는데, 마스코트는 어떻게 하지?” 선생님은 교실 구석의 3D 프린터를 가리켰다. 평면과 입체는 만드는 방법부터 달랐다."], q:"평면 설계와 입체 설계는 각각 어떻게 실제 물건이 될까요?"},
 steps:[
  {t:"2D 설계와 레이저 절단기", li:["<b>2D 평면 설계</b>: 가로·세로 치수로 평면에 표현하는 설계 (평면도, 회로도, 조립도 등)","<b>레이저 절단기</b>: 거울과 렌즈로 레이저를 한 점에 모아 그 열로 재료를 녹이거나 증발시켜요","<b>커팅(CUT)</b>: 세고 느리게 움직여 재료를 관통해 잘라요. 주로 <b>벡터</b> 도안을 써요","<b>각인(SCAN)</b>: 약하고 빠르게 움직여 표면에 새겨요. 벡터와 비트맵 도안 모두 쓸 수 있어요","안전: 보호 장비를 쓰고, 알맞은 재료(MDF, 아크릴 등)인지 확인하고, 사용 후 렌즈와 기계를 청소해요"],
   q:{q:"레이저 세기를 약하게 하고 빠르게 움직이면 할 수 있는 작업은?", o:["각인","커팅","용접","주조"], a:0, why:"열이 닿는 시간이 짧아 표면만 태워 새겨요."}},
  {t:"3D 프린터의 세 방식", li:["3D 프린터는 3차원 모델을 <b>층층이 쌓아</b> 실제 물체로 만들어요","<b>FDM(압출 적층)</b>: 열을 가하면 녹는 재료를 노즐로 짜내 한 줄씩 쌓아요. 쓰기 쉽고 재료가 다양해요","<b>SLA(광경화 적층)</b>: 액체 수지에 자외선을 쏘아 굳혀요. 정밀하고 빨라요","<b>SLS(분말 소결)</b>: 플라스틱·금속·세라믹 분말을 레이저로 녹여 붙여요. 튼튼하고 오래가요"],
   q:{q:"열로 녹인 재료를 노즐로 짜내 한 줄씩 쌓는 방식은?", o:["FDM","SLA","SLS","CNC"], a:0, why:"교실에서 가장 흔히 보는 방식이 FDM이에요."}},
  {t:"모델링에서 출력까지", li:["모델링 방식: <b>폴리곤</b>(삼각형 면의 모음, 게임), <b>넙스</b>(수학적 곡선으로 매끄러운 곡면, 제품·건축), <b>서브디비전</b>(둘의 장점, 애니메이션)","출력 과정: 3D 모델링 → <b>STL 변환</b> → <b>슬라이싱</b>(층으로 자르기) → 프린팅 → <b>후처리</b>(사포질, 칠하기)","STL로 바꾼 뒤에는 고치기 어려우니 원본 모델 파일을 잘 보관해요"], key:"모델링 → STL → 슬라이싱 → 프린팅 → 후처리",
   q:{q:"모델을 한 층씩 잘라 프린터가 출력할 수 있게 바꾸는 과정은?", o:["슬라이싱","후처리","각인","렌더링"], a:0, why:"얇게 썰어(slice) 층마다 경로를 만드는 과정이에요."}}

  {q:"액체 수지에 자외선을 쏘아 굳히는 3D 프린팅 방식은?", o:["SLA","FDM","SLS","레이저 각인"], a:0},

  {id:"first", m:"1", name:"첫걸음", how:"첫 계단 통과"},
  {id:"oneshot", m:"✓", name:"한 번에 통과", how:"시험 첫 도전에 80점 이상"},

  {id:"lab", m:"⚙", name:"실험가", how:"실습 위젯 직접 조작"},
  {id:"unit", m:"▲", name:"단원 정복", how:"한 대단원 모두 완료"},
  {id:"streak", m:"3일", name:"3일 연속", how:"3일 연속 학습"},
  {id:"grad", m:"★", name:"졸업", how:"모든 레슨 완료"}
];
const XP = {step:10, cards:20, pass:50, perfect:20};
const KEY = COURSE.key;

/* ---------- state ---------- */
const fresh = () => ({v:1, xp:0, les:{}, badges:[], streak:{last:null, n:0}, wrong:{}});
let S = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) { s.wrong = s.wrong || {}; return s; } } catch(e){} return fresh(); })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const L = id => S.les[id] || (S.les[id] = {steps:0, cards:false, best:null, passed:false, tries:0});
const lessonById = id => LESSONS.find(l => l.id === id);
const unitById = id => UNITS.find(u => u.id === id);
const isPassed = id => !!(S.les[id] && S.les[id].passed);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
const dayStr = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

/* streak counts days with real learning (a solved step or a test), not visits */
function studied(){
  const today = dayStr(new Date()), y = new Date(); y.setDate(y.getDate()-1);
  if (S.streak.last === today) return;
  S.streak.n = S.streak.last === dayStr(y) ? S.streak.n + 1 : 1;
  S.streak.last = today;
  if (S.streak.n >= 3) badge("streak");
}
function streakNow(){
  const today = dayStr(new Date()), y = new Date(); y.setDate(y.getDate()-1);
  return S.streak.last === today || S.streak.last === dayStr(y) ? S.streak.n : 0;
}

/* ---------- transient UI ---------- */
let view = {name:"home"};
const ui = {wrong:{}, cards:{}, test:{}, pc:{meat:1, dessert:0, soup:1}, mx:[[3,3,2],[3,2,2],[2,3,1]], sv:90, confirmReset:false};
const orders = new Map();
function order(key, n){
  if (!orders.has(key)) { const a = [...Array(n).keys()]; for (let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} orders.set(key,a); }
  return orders.get(key);
}

/* ---------- rewards ---------- */
function toast(html){
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = html;
  document.getElementById("toasts").appendChild(t); setTimeout(() => t.remove(), 2600);
}
function lvl(xp){ let i = 0; LEVELS.forEach((l,k) => { if (xp >= l[0]) i = k; }); return i; }
function addXP(n, why){ const before = lvl(S.xp); S.xp += n; toast(`<b>+${n} XP</b> ${why}`); if (lvl(S.xp) > before) toast(`레벨 업! <b>Lv.${lvl(S.xp)+1} ${LEVELS[lvl(S.xp)][1]}</b>`); }
function badge(id){ if (S.badges.includes(id)) return; S.badges.push(id); const b = BADGES.find(x=>x.id===id); toast(`배지 획득 <b>${b.name}</b>`); }
function checkCompletion(){
  UNITS.forEach(u => { if (LESSONS.filter(l => l.unit === u.id).every(l => isPassed(l.id))) badge("unit"); });
  if (LESSONS.every(l => isPassed(l.id))) badge("grad");
}
function wrongCount(){ return Object.values(S.wrong).reduce((a, l) => a + l.length, 0); }

/* ---------- views ---------- */
const OPTN = ["①","②","③","④"];
const med = id => (typeof MEDIA !== "undefined" && MEDIA[id]) || null;

function header(){
  const i = lvl(S.xp), wc = wrongCount();
  return `<button class="icon-btn menu-btn" data-act="side" aria-label="과정 메뉴 열기" title="과정 메뉴">☰</button><details class="course"><summary><span class="mark">${esc(COURSE.short)}</span><span><b>${esc(COURSE.name)}</b><small>우리 반 AI·공학 교실</small></span><span class="chev">▾</span></summary>
    <div class="menu">${COURSES.map(c => `<a href="${c.href}" ${c.id===COURSE.id?'aria-current="page"':""}><i style="background:${c.color}"></i>${c.name}</a>`).join("")}<hr><a href="../">← 교실 홈</a></div></details>
  <nav class="nav"><button data-act="home" aria-current="${view.name==="home"||view.name==="lesson"}">레슨</button><button data-act="glossary" aria-current="${view.name==="glossary"}">용어 사전</button><button data-act="review" aria-current="${view.name==="review"}">오답 노트${wc?`<span class="cnt">${wc}</span>`:""}</button></nav>
  <div class="me"><span class="lv">Lv.${i+1} ${LEVELS[i][1]}</span><button class="icon-btn" data-act="fs" aria-label="글자 크기 바꾸기" title="글자 크기">가+</button><button class="icon-btn" data-act="theme" aria-label="밝게/어둡게 바꾸기" title="밝게/어둡게">◐</button></div>`;
}

function nextLesson(){ return LESSONS.find(l => !isPassed(l.id)) || LESSONS[0]; }

function lessonRow(l){
  const s = S.les[l.id] || {}, m = med(l.id);
  const dots = [0,1,2].map(k => `<i class="${(s.steps||0)>k?"on":""}"></i>`).join("") + `<i class="${s.cards?"on":""}"></i><i class="${s.passed?"on":""}"></i>`;
  return `<button class="les" data-act="open" data-id="${l.id}">
    <span class="th">${m && m.img ? `<img src="${m.img.thumb}" alt="" loading="lazy">` : ""}</span>
    <span class="t"><span class="code">${l.id}</span><b>${esc(l.title)}</b><small>${esc(l.sub)}</small>
      <span class="dots" aria-label="진행 상황">${dots}${s.passed ? `<span class="score">${s.best}점</span>` : ""}</span></span></button>`;
}

    <div class="stat"><small>연속 학습</small><b>🔥 ${streakNow()}일</b><small>계단을 풀거나 시험을 본 날만 세요</small></div>

  </div>

    <li><b>1</b><div><strong>이야기·영상</strong><span>장면과 영상으로 궁금증 만들기</span></div></li>
    <li><b>2</b><div><strong>계단 오르기</strong><span>확인문제를 맞히면 다음 칸이 열려요</span></div></li>
    <li><b>3</b><div><strong>용어 카드</strong><span>용어와 뜻을 짝지어요</span></div></li>
    <li><b>4</b><div><strong>10문제 시험</strong><span>80점 이상이면 통과, 틀린 문제는 오답 노트로</span></div></li>
  </ol>
  <div class="sec-h"><h2>대단원</h2><small>레슨을 눌러 시작해요</small></div>
  <div class="units">${UNITS.map(u => `<section>
      <div class="unit-h"><span class="no">${u.no}</span><h3>${esc(u.title)}</h3></div><p class="unit-d">${esc(u.desc)}</p>
      <div class="les-list">${LESSONS.filter(l => l.unit === u.id).map(lessonRow).join("")}</div></section>`).join("")}</div>

  <div class="badges">${BADGES.map(b => `<div class="badge ${S.badges.includes(b.id)?"on":""}"><div class="m">${b.m}</div><strong>${b.name}</strong><span>${b.how}</span></div>`).join("")}</div>
  <div class="reset">${ui.confirmReset
    ? `기록을 모두 지울까요? 되돌릴 수 없어요. <button class="btn ghost" data-act="reset-yes">모두 지우기</button><button class="linkish" data-act="reset-no">취소</button>`
    : `<button class="linkish" data-act="reset">기록 모두 지우기</button>`}</div>`;
}

function quizBlock(key, q, opts){
  const ord = order(key, q.o.length);
  return `<div class="opts">${ord.map((oi,k) => {
    const cls = opts.solved && oi === q.a ? "right" : opts.wrong.has(oi) ? "wrong" : "";
    return `<button class="opt ${cls}" data-act="${opts.act}" ${opts.data} data-i="${oi}" ${opts.solved || opts.wrong.has(oi) ? "disabled" : ""}><span class="n">${OPTN[k]}</span><span>${q.o[oi]}</span></button>`;
  }).join("")}</div>`;
}

/* ---------- widgets ---------- */
function perceptron(){
  const p = ui.pc, w = {meat:.6, dessert:.2, soup:.3}, b = -.5;
  const sum = p.meat*w.meat + p.dessert*w.dessert + p.soup*w.soup + b, out = sum > 0 ? 1 : 0;
  const tog = (k, label) => `<button class="tog" data-act="pc" data-k="${k}" aria-pressed="${!!p[k]}">${label}<span class="num">w=${w[k]}</span></button>`;
  return `<div class="pc"><span class="tag">직접 계산해 봐요</span>
    <div class="pc-in">${tog("meat","고기 반찬")}${tog("dessert","디저트")}${tog("soup","따뜻한 국")}</div>
    <div class="pc-out num">가중합 = ${p.meat}×0.6 + ${p.dessert}×0.2 + ${p.soup}×0.3 − 0.5 = ${sum.toFixed(1)}<br>출력 → <span class="res">${out} (${out ? "맛있음" : "아쉬움"})</span></div></div>`;
}
function matrix(){
  const cfg = COURSE.matrix || {ideas:["A","B","C"], crit:["기준1","기준2","기준3"]}, lab = ["","미흡","보통","우수"];
  const tot = ui.mx.map(r => r.reduce((a,b) => a+b, 0)), best = Math.max(...tot);
  return `<div class="pc"><span class="tag">직접 채점해 봐요 · 칸을 누르면 점수가 바뀌어요</span>
    <div class="pc-out"><table class="mx"><thead><tr><th>아이디어</th>${cfg.crit.map(c => `<th>${c}</th>`).join("")}<th>총점</th></tr></thead><tbody>
    ${ui.mx.map((r,i) => `<tr class="${tot[i]===best?"best":""}"><th>${cfg.ideas[i]}</th>${r.map((v,j) => `<td><button class="tog" data-act="mx" data-i="${i}" data-j="${j}">${lab[v]}<span class="num">${v}</span></button></td>`).join("")}<td class="num">${tot[i]}</td></tr>`).join("")}
    </tbody></table></div><p class="pc-res">평가 행렬 결과, 가장 알맞은 아이디어: <b>${cfg.ideas[tot.indexOf(best)]}</b></p></div>`;
}
function servo(){
  const a = ui.sv, state = a <= 60 ? "꽉 쥠" : a <= 120 ? "반쯤 열림" : "활짝 열림";
  return `<div class="pc"><span class="tag">직접 움직여 봐요 · 서보 모터로 집게 각도 바꾸기</span>
    <div class="pc-in">${[0,45,90,135,180].map(v => `<button class="tog" data-act="sv" data-v="${v}" aria-pressed="${a===v}">${v}°</button>`).join("")}</div>
    <div class="pc-out num">gripServo.write(${a});<br>집게 상태 → <span class="res">${state}</span></div></div>`;
}
const WIDGETS = {perceptron, matrix, servo};

function mediaBlock(l){
  const m = med(l.id); if (!m) return "";
  const vids = (m.videos || []).map(v => `<div class="vid">
      <div class="frame" id="v-${v.id}"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy">
        <button class="play" data-act="play" data-v="${v.id}" aria-label="${esc(v.title)} 재생"><span></span></button>${v.len ? `<span class="len">${v.len}</span>` : ""}</div>
      <div class="info"><b>${esc(v.title)}</b><span>${esc(v.ch)}</span><a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">YouTube에서 보기 ↗</a></div></div>`).join("");
  const links = (m.links || []).map(k => `<a href="${k[1]}" target="_blank" rel="noopener">${esc(k[0])} ↗</a>`).join("");
  return `<section class="card media" id="sec-media"><span class="tag">보고 이해하기 · 사진과 영상</span>
    ${m.img ? `<figure class="photo"><img src="${m.img.big}" alt="${esc(m.img.alt || l.title)}" loading="lazy"><figcaption>${esc(m.img.alt || "")} · 사진: ${esc(m.img.artist || "작가 미상")} · ${esc(m.img.lic)} · <a href="${m.img.page}" target="_blank" rel="noopener">위키미디어 공용</a></figcaption></figure>` : ""}
    ${vids ? `<div class="videos">${vids}</div>` : ""}
    ${links ? `<div><p class="lock" style="margin-bottom:8px">더 알아보기</p><div class="links">${links}</div></div>` : ""}</section>`;
}

function lessonProgress(id){
  const l = lessonById(id), s = L(id);
  return (Math.min(s.steps, l.steps.length) + (s.cards?1:0) + (s.passed?1:0)) / (l.steps.length + 2);
}

function lesson(id){
  const l = lessonById(id), s = L(id), u = unitById(l.unit);
  const idx = LESSONS.indexOf(l), prev = LESSONS[idx-1], next = LESSONS[idx+1];
  const stairsDone = s.steps >= l.steps.length;
  const steps = l.steps.map((st, k) => {
    const n = `${k+1}계단`;
    if (k > s.steps) return `<div class="card step locked" id="step-${k}"><div class="step-h"><b>${n}</b><h3>${st.t}</h3></div><p class="note">앞 계단의 확인문제를 맞히면 열려요.</p></div>`;
    const solved = s.steps > k, wk = id+"-s"+k, wrong = ui.wrong[wk] || new Set();
    return `<div class="card step" id="step-${k}">
      <div class="step-h"><b>${n}</b><h3>${st.t}</h3></div>
      ${st.p ? `<p class="intro">${st.p}</p>` : ""}
      <ul>${st.li.map(x => `<li>${x}</li>`).join("")}</ul>
      ${st.widget && WIDGETS[st.widget] ? WIDGETS[st.widget]() : ""}
      ${st.key ? `<div class="key"><b>꼭 기억해요</b>${st.key}</div>` : ""}
      <div class="quiz"><p class="qq">확인문제 · ${st.q.q}</p>
        ${quizBlock(wk, st.q, {solved, wrong, act:"step", data:`data-id="${id}" data-k="${k}"`})}
        ${solved ? `<p class="fb ok">정답이에요! ${st.q.why}</p>` : wrong.size ? `<p class="fb no">아쉬워요. 위 설명을 다시 읽고 골라 봐요.</p>` : ""}</div></div>`;
  }).join("");
  const pips = l.steps.map((st,k) => `<span class="pip ${s.steps>k?"done":s.steps===k?"cur":""}">${s.steps>k?"✓ ":""}${k+1}계단</span>`).join("");
  return `<div class="lesson"><div class="lmain">
    <div class="l-head"><div class="crumb"><button data-act="home">${esc(COURSE.name)}</button><span>›</span><span>${u.no}. ${esc(u.title)}</span><span>›</span><span class="num">${l.id}</span></div>
      <h1>${esc(l.title)}</h1><p class="sub">${esc(l.sub)}</p></div>
    <section class="card" id="sec-goals"><span class="tag">이번 레슨의 목표</span><ul class="goals">${l.goals.map(g => `<li>${g}</li>`).join("")}</ul></section>
    <section class="story" id="sec-story"><span class="tag">이야기 · 먼저 읽어 봐요</span><h2>${l.story.title}</h2>
      ${l.story.p.map(p => `<p>${p}</p>`).join("")}<p class="q">🤔 ${l.story.q}</p></section>
    ${mediaBlock(l)}
    <section><div class="sec-h" style="margin-top:6px"><h2>계단 오르기</h2><small>${l.steps.length}칸을 한 칸씩</small></div>
      <div class="pips">${pips}</div><div class="steps">${steps}</div></section>
    <section class="card" id="sec-sum"><span class="tag">정리 · 한 줄씩 다시 보기</span>
      ${stairsDone ? `<ul class="sumlist">${l.summary.map(x => `<li>${x}</li>`).join("")}</ul>` : `<p class="lock">🔒 계단을 모두 오르면 열려요.</p>`}</section>
    <section class="card step" id="cards"><span class="tag">게임 · 용어 카드 짝 맞추기</span>
      ${stairsDone ? cardGame(l) : `<p class="lock">🔒 계단을 모두 오르면 열려요.</p>`}</section>
    <section class="card step" id="test"><span class="tag">시험 · 10문제, 80점 이상이면 통과</span>
      ${stairsDone ? testBlock(l) : `<p class="lock">🔒 계단을 모두 오르면 열려요. 80점 이상을 받으면 레슨이 완료돼요.</p>`}</section>
    <nav class="foot-nav">
      ${prev ? `<button class="btn ghost" data-act="open" data-id="${prev.id}"><small>← 이전 레슨</small>${esc(prev.title)}</button>` : ""}
      ${next ? `<button class="btn ghost next" data-act="open" data-id="${next.id}"><small>다음 레슨 →</small>${esc(next.title)}</button>` : `<button class="btn ghost next" data-act="home"><small>마지막 레슨이에요</small>레슨 목록으로</button>`}
    </nav></div></div>`;
}

function cardGame(l){
  const s = L(l.id);
  const g = ui.cards[l.id] || (ui.cards[l.id] = {sel:null, got:s.cards ? l.cards.map((_,i)=>i) : [], bad:null, miss:0});
  const n = l.cards.length, to = order("ct"+l.id, n), dor = order("cd"+l.id, n);
  const cls = (side, i) => g.got.includes(i) ? "got" : g.bad && g.bad[side] === i ? "bad" : g.sel && g.sel.side === side && g.sel.i === i ? "sel" : "";
  const all = g.got.length === n;
  return `<p class="lock" style="margin-bottom:12px">왼쪽 용어를 누르고, 알맞은 뜻을 눌러 짝을 지어요.</p>
  <div class="match">
    <div>${to.map(i => `<button class="mc term ${cls("t",i)}" data-act="card" data-id="${l.id}" data-side="t" data-i="${i}" ${g.got.includes(i)?"disabled":""}>${l.cards[i][0]}</button>`).join("")}</div>
    <div>${dor.map(i => `<button class="mc ${cls("d",i)}" data-act="card" data-id="${l.id}" data-side="d" data-i="${i}" ${g.got.includes(i)?"disabled":""}>${l.cards[i][1]}</button>`).join("")}</div>
  </div>
  ${all ? `<p class="fb ok">모든 짝을 맞혔어요! <button class="linkish" data-act="card-again" data-id="${l.id}">다시 하기</button></p>` : `<p class="fb num lock">${g.got.length}/${n} 짝 완성</p>`}`;
}

function testQs(l){ return [...l.steps.map(s => s.q), ...l.test]; }

function testBlock(l){
  const s = L(l.id);
  const t = ui.test[l.id] || (ui.test[l.id] = {seed:0, ans:{}, done:false, score:0});
  const qs = testQs(l), qo = order("tq"+l.id+"-"+t.seed, qs.length), answered = Object.keys(t.ans).length;
  let head = "";
  if (t.done) {
    const pass = t.score >= 80, nWrong = qs.filter((q, qi) => t.ans[qi] !== q.a).length;
    head = `<div class="result ${pass?"pass":"fail"}"><span class="score">${t.score}점</span>
      <div><strong>${pass ? "🎉 통과했어요! 레슨 완료" : "아쉬워요. 80점부터 통과예요"}</strong><br>
      <span class="lock">${nWrong ? `틀린 ${nWrong}문제는 오답 노트에 담았어요. 아래에서 정답을 확인해요.` : "모두 맞혔어요!"}</span></div>
      <button class="btn ghost" data-act="retest" data-id="${l.id}">다시 풀기</button></div>`;
  } else if (s.passed) head = `<p class="fb ok" style="margin:0 0 8px">이미 통과한 레슨이에요 (최고 ${s.best}점). 다시 풀어도 좋아요.</p>`;
  const body = qo.map((qi, k) => {
    const q = qs[qi], ord = order(`t${l.id}-${t.seed}-${qi}`, q.o.length), pick = t.ans[qi];
    return `<div class="tq"><p class="qq"><span class="num">${String(k+1).padStart(2,"0")}</span>${q.q}</p><div class="opts">
      ${ord.map((oi, j) => {
        let c = ""; if (t.done) c = oi === q.a ? "right" : oi === pick ? "wrong" : ""; else if (pick === oi) c = "sel";
        return `<button class="opt ${c}" data-act="tpick" data-id="${l.id}" data-q="${qi}" data-i="${oi}" ${t.done?"disabled":""}><span class="n">${OPTN[j]}</span><span>${q.o[oi]}</span></button>`;
      }).join("")}</div></div>`;
  }).join("");
  const submit = t.done ? "" : `<div style="display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap">
    <button class="btn primary" data-act="submit" data-id="${l.id}" ${answered < qs.length ? "disabled" : ""}>채점하기</button>
    <span class="num lock">${answered}/${qs.length} 답함</span></div>`;
  return head + body + submit;
}

function glossary(){
  const rows = LESSONS.flatMap(l => l.cards.map(c => ({t:c[0], d:c[1], l}))).sort((a,b) => a.t.localeCompare(b.t, "ko"));
  return `<div class="l-head"><h1>용어 사전</h1><p class="sub">모든 레슨의 용어 ${rows.length}개를 가나다순으로 모았어요.</p></div>
  <div style="margin:18px 0"><input class="search" id="gl-search" type="search" placeholder="용어나 뜻으로 찾기" aria-label="용어 찾기"></div>
  <div class="card" style="padding:6px 18px">${rows.map(r => `<div class="gl-row" data-s="${esc((r.t+" "+r.d).toLowerCase())}"><strong>${r.t}</strong><span>${r.d}</span><button data-act="open" data-id="${r.l.id}">${r.l.id} ${esc(r.l.title)} →</button></div>`).join("")}</div>`;
}

function review(){
  const items = Object.entries(S.wrong).flatMap(([lid, list]) => { const l = lessonById(lid); return l ? list.map(qi => ({l, qi, q:testQs(l)[qi]})) : []; }).filter(x => x.q);
  return `<div class="l-head"><h1>오답 노트</h1><p class="sub">시험에서 틀린 문제를 모았어요. 정답을 확인하고, 이해했으면 ‘알았어요’를 눌러 지워요.</p></div>
  <div class="rv" style="margin-top:18px">${items.length ? items.map(x => `<div class="card"><p class="qq">${x.q.q}</p><p class="ans">정답: ${x.q.o[x.q.a]}</p>${x.q.why ? `<p class="lock">${x.q.why}</p>` : ""}
    <div class="meta"><span class="num">${x.l.id} ${esc(x.l.title)}</span><button class="btn ghost" style="padding:6px 12px" data-act="open" data-id="${x.l.id}">레슨으로 가기</button><button class="btn primary" style="padding:6px 12px" data-act="unwrong" data-id="${x.l.id}" data-q="${x.qi}">알았어요 ✓</button></div></div>`).join("")
    : `<p class="empty">틀린 문제가 없어요. 시험을 보면 틀린 문제가 여기에 모여요.</p>`}</div>`;
}

function sectionList(l){
  const s = L(l.id), stairsDone = s.steps >= l.steps.length;
  const item = (href, label, done, locked) => `<a href="#${href}" data-jump="${href}" class="${done?"done":""} ${locked?"lock":""}"><i>${done?"✓":""}</i>${label}</a>`;
  return `<nav class="side-sec" aria-label="레슨 차례">${item("sec-goals","이번 레슨의 목표", true)}${item("sec-story","이야기", true)}${med(l.id)?item("sec-media","사진과 영상", true):""}
    ${l.steps.map((st,k) => item("step-"+k, `${k+1}계단 · ${st.t}`, s.steps>k, k > s.steps)).join("")}
    ${item("sec-sum","정리", stairsDone, !stairsDone)}${item("cards","용어 카드", s.cards, !stairsDone)}${item("test","10문제 시험", s.passed, !stairsDone)}</nav>`;
}
function sidebar(){
  const cur = view.name === "lesson" ? view.id : null, wc = wrongCount();
  return `<button class="side-home ${view.name==="home"?"on":""}" data-act="home">🏠 ${esc(COURSE.name)} 처음</button>
    ${UNITS.map(u => `<p class="su-h"><span>${u.no}</span>${esc(u.title)}</p>
      ${LESSONS.filter(l => l.unit === u.id).map(l => {
        const s = S.les[l.id] || {}, st = s.passed ? "done" : (s.steps > 0 ? "go" : "");
        return `<button class="side-les ${st} ${cur===l.id?"on":""}" data-act="open" data-id="${l.id}" ${cur===l.id?'aria-current="page"':""}><i>${s.passed?"✓":s.steps>0?"●":""}</i><span><small>${l.id}</small>${esc(l.title)}</span></button>${cur===l.id ? sectionList(l) : ""}`;
      }).join("")}`).join("")}
    <div class="side-foot"><button class="side-tool ${view.name==="glossary"?"on":""}" data-act="glossary">📖 용어 사전</button>
      <button class="side-tool ${view.name==="review"?"on":""}" data-act="review">📝 오답 노트${wc?`<span class="cnt">${wc}</span>`:""}</button></div>`;
}
function setSide(open){
  document.getElementById("side").classList.toggle("open", open);
  document.getElementById("scrim").hidden = !open;
}

function setProgress(){
  const bar = document.getElementById("lprog");
  if (view.name !== "lesson") { bar.hidden = true; return; }
  bar.hidden = false; bar.firstElementChild.style.width = (lessonProgress(view.id) * 100) + "%";
}
function render(){
  document.getElementById("top").innerHTML = header();
  const side = document.getElementById("side"), sy = side.scrollTop;
  side.innerHTML = sidebar(); side.scrollTop = sy;
  const app = document.getElementById("app");
  app.innerHTML = view.name === "lesson" ? lesson(view.id) : view.name === "glossary" ? glossary() : view.name === "review" ? review() : home();
  setProgress();
}
function go(v){
  view = v; ui.confirmReset = false; setSide(false); render(); window.scrollTo(0,0);
  const on = document.querySelector(".side .on"); if (on) on.scrollIntoView({block:"nearest"});
}

/* ---------- events ---------- */
document.addEventListener("input", e => {
  if (e.target.id !== "gl-search") return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".gl-row").forEach(r => { r.hidden = q && !r.dataset.s.includes(q); });
});
document.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); setSide(false); const t = document.getElementById(j.dataset.jump); if (t) t.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (el.tagName === "A") e.preventDefault();
  if (a === "side") return setSide(true);
  if (a === "side-close") return setSide(false);
  if (a === "home") return go({name:"home"});
  if (a === "glossary") return go({name:"glossary"});
  if (a === "review") return go({name:"review"});
  if (a === "open") return go({name:"lesson", id});
  if (a === "theme") {
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("class-theme", r.dataset.theme); } catch(e){}
    return;
  }
  if (a === "fs") {
    const steps = [1, 1.12, 1.25], cur = +getComputedStyle(document.documentElement).getPropertyValue("--fs") || 1;
    const nx = steps[(steps.indexOf(cur) + 1) % steps.length] || 1;
    document.documentElement.style.setProperty("--fs", nx); try { localStorage.setItem("class-fs", nx); } catch(e){}
    toast(`글자 크기 <b>${Math.round(nx*100)}%</b>`); return;
  }
  if (a === "play") { document.getElementById("v-" + el.dataset.v).innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${el.dataset.v}?autoplay=1&rel=0" title="참고 영상" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`; return; }
  if (a === "reset") { ui.confirmReset = true; return render(); }
  if (a === "reset-no") { ui.confirmReset = false; return render(); }
  if (a === "reset-yes") { S = fresh(); save(); ui.wrong = {}; ui.cards = {}; ui.test = {}; ui.confirmReset = false; orders.clear(); toast("기록을 모두 지웠어요"); return render(); }
  if (a === "unwrong") { S.wrong[id] = (S.wrong[id] || []).filter(q => q !== +el.dataset.q); if (!S.wrong[id].length) delete S.wrong[id]; save(); return render(); }

  if (a === "step") {
    const k = +el.dataset.k, i = +el.dataset.i, q = lessonById(id).steps[k].q, s = L(id), wk = id+"-s"+k;
    if (i === q.a) {
      if (s.steps === k) { s.steps++; addXP(XP.step, `${k+1}계단 통과`); badge("first"); studied(); save(); }
      render();
      const nx = document.getElementById("step-"+(k+1)) || document.getElementById("sec-sum");
      if (nx && s.steps === k+1) setTimeout(() => nx.scrollIntoView({behavior:"smooth", block:"start"}), 350);
    } else { (ui.wrong[wk] || (ui.wrong[wk] = new Set())).add(i); render(); }
    return;
  }
  if (a === "pc" || a === "mx" || a === "sv") {
    if (a === "pc") { const k = el.dataset.k; ui.pc[k] = ui.pc[k] ? 0 : 1; }
    if (a === "mx") { const i = +el.dataset.i, j2 = +el.dataset.j; ui.mx[i][j2] = ui.mx[i][j2] % 3 + 1; }
    if (a === "sv") ui.sv = +el.dataset.v;
    if (!S.badges.includes("lab")) { badge("lab"); save(); }
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (a === "card") {
    const l = lessonById(id), g = ui.cards[id], side = el.dataset.side, i = +el.dataset.i;
    if (g.bad) return;
    if (!g.sel || g.sel.side === side) { g.sel = {side, i}; return render(); }
    const t = side === "t" ? i : g.sel.i, d = side === "d" ? i : g.sel.i;
    g.sel = null;
    if (t === d) {
      g.got.push(t);
      if (g.got.length === l.cards.length) { const s = L(id); if (!s.cards) { s.cards = true; addXP(XP.cards, "용어 카드 완성"); } if (g.miss === 0) badge("cards"); save(); }
      return render();
    }
    g.miss++; g.bad = {t, d}; render(); setTimeout(() => { g.bad = null; render(); }, 650); return;
  }
  if (a === "card-again") { ui.cards[id] = {sel:null, got:[], bad:null, miss:0}; orders.delete("ct"+id); orders.delete("cd"+id); return render(); }
  if (a === "tpick") { ui.test[id].ans[+el.dataset.q] = +el.dataset.i; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (a === "submit") {
    const l = lessonById(id), t = ui.test[id], s = L(id), qs = testQs(l);
    const wrongIdx = qs.map((q, qi) => t.ans[qi] === q.a ? -1 : qi).filter(x => x >= 0);
    t.score = (qs.length - wrongIdx.length) * 10; t.done = true; s.tries++;
    if (wrongIdx.length) S.wrong[id] = [...new Set([...(S.wrong[id] || []), ...wrongIdx])];
    if (t.score >= 80) {
      if (!s.passed) { s.passed = true; addXP(XP.pass, "레슨 통과"); if (s.tries === 1) badge("oneshot"); }
      if (t.score === 100 && (s.best || 0) < 100) { addXP(XP.perfect, "만점 보너스"); badge("perfect"); }
    }
    s.best = Math.max(s.best || 0, t.score);
    studied(); checkCompletion(); save(); render();
    document.getElementById("test").scrollIntoView({behavior:"smooth", block:"start"}); return;
  }
  if (a === "retest") { const t = ui.test[id]; t.seed++; t.ans = {}; t.done = false; render(); document.getElementById("test").scrollIntoView({block:"start"}); }
});
document.addEventListener("click", e => { const d = document.querySelector(".course[open]"); if (d && !d.contains(e.target)) d.open = false; });

try { const th = localStorage.getItem("class-theme"); if (th) document.documentElement.dataset.theme = th; const fs = localStorage.getItem("class-fs"); if (fs) document.documentElement.style.setProperty("--fs", fs); } catch(e){}
render();
</script>
</body>
